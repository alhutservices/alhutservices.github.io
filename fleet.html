<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>تأجير السيارات في العراق · منصة الحوت</title>
<meta name="theme-color" content="#FF385C">
<meta name="description" content="استأجر سيارتك في بغداد وكركوك وأربيل وكل محافظات العراق — أسطول واسع بأسعار يومية واضحة وحجز فوري.">
<meta property="og:title" content="تأجير السيارات في العراق · منصة الحوت">
<meta property="og:description" content="استأجر سيارتك في بغداد وكركوك وأربيل وكل محافظات العراق — أسطول واسع بأسعار يومية واضحة وحجز فوري.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=IBM+Plex+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
--bg:#F7F7F7;--white:#FFFFFF;--border:#E4E4E4;--line:#EFEFEF;
--red:#FF385C;--red-d:#E31C5F;--red-l:#FFF0F2;--red-m:rgba(255,56,92,.1);
--red-g:linear-gradient(135deg,#FF385C 0%,#E31C5F 100%);
--green:#00A699;--green-l:#E6F7F6;
--amber:#FC642D;--amber-l:#FFF3EE;
--blue:#0066CC;--blue-l:#EEF5FF;
--violet:#6B46C1;--violet-l:#F3F0FF;
--gold:#F5A623;--gold-l:#FFF8EC;
--tx0:#1A1A1A;--tx1:#484848;--tx2:#717171;--tx3:#A8A8A8;--tx4:#CFCFCF;
--sh-sm:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
--sh-md:0 2px 6px rgba(0,0,0,.07),0 8px 24px rgba(0,0,0,.06);
--sh-lg:0 8px 28px rgba(0,0,0,.14),0 2px 8px rgba(0,0,0,.08);
--sh-red:0 6px 20px rgba(255,56,92,.32);
--r2:8px;--r3:12px;--r4:16px;--r5:20px;--r6:28px;--r-pill:999px;
--nav-h:64px;
}
*,::before,::after{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--bg);font-family:'Cairo',system-ui,sans-serif;color:var(--tx0);-webkit-font-smoothing:antialiased;line-height:1.5;overflow-x:hidden;}
body.ltr{direction:ltr;text-align:left;}
button,input,select,textarea{font-family:inherit;color:inherit;}
button{cursor:pointer;border:none;background:none;}
a{text-decoration:none;color:inherit;}
img{display:block;max-width:100%;}
.dn{display:none!important;}
::-webkit-scrollbar{width:7px;height:7px;}
::-webkit-scrollbar-thumb{background:var(--tx4);border-radius:99px;}
.mono{font-family:'IBM Plex Mono',monospace;font-variant-numeric:tabular-nums;}

/* NAV — مطابق للصفحة الرئيسية */
.nav{position:sticky;top:0;z-index:500;height:var(--nav-h);background:rgba(255,255,255,.88);backdrop-filter:blur(18px) saturate(180%);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,40px);transition:box-shadow .3s;}
.nav.scrolled{box-shadow:var(--sh-sm);}
.nav-logo{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.15rem;letter-spacing:-.02em;}
.nav-logo .whale{width:38px;height:38px;border-radius:11px;background:var(--red-g);display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:var(--sh-red);}
.nav-right{display:flex;align-items:center;gap:10px;}
.lang-wrap{position:relative;}
.lang-btn{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:var(--r-pill);background:var(--bg);border:1px solid var(--border);font-size:.78rem;font-weight:800;transition:.18s;}
.lang-btn:hover{border-color:var(--tx3);}
.lang-menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;background:var(--white);border:1px solid var(--border);border-radius:var(--r3);box-shadow:var(--sh-lg);padding:6px;min-width:150px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.2s;z-index:60;}
.lang-menu.open{opacity:1;visibility:visible;transform:none;}
.lang-opt{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:var(--r2);font-size:.82rem;font-weight:700;width:100%;text-align:start;transition:.15s;}
.lang-opt:hover{background:var(--bg);}
.lang-opt.on{background:var(--red-l);color:var(--red);font-weight:900;}
.nav-partner{padding:9px 16px;border-radius:var(--r-pill);background:var(--tx0);color:#fff;font-size:.78rem;font-weight:800;transition:.2s;white-space:nowrap;}
.nav-partner:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(0,0,0,.18);}

/* شريط الفلترة */
.wrap{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,40px);}
.pagehead{background:var(--white);border-bottom:1px solid var(--line);padding:clamp(20px,4vw,32px) 0 0;}
.ph-inner{max-width:1200px;margin:0 auto;padding:0 clamp(16px,4vw,40px);}
.ph-title{font-size:clamp(1.4rem,3.6vw,2rem);font-weight:900;letter-spacing:-.02em;display:flex;align-items:center;gap:10px;}
.ph-sub{font-size:.86rem;font-weight:600;color:var(--tx2);margin-top:4px;}
.filters{display:grid;grid-template-columns:1.2fr 1fr auto;gap:0;background:var(--white);border:1px solid var(--border);border-radius:var(--r6);box-shadow:var(--sh-md);overflow:hidden;margin:20px 0 0;}
.ff{padding:14px 20px;border-inline-start:1px solid var(--line);position:relative;transition:background .18s;}
.ff:first-child{border-inline-start:none;}
.ff:hover{background:var(--bg);}
.ff label{display:block;font-size:.64rem;font-weight:900;color:var(--tx2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.07em;}
.ff select,.ff input{border:none;outline:none;font-size:.94rem;font-weight:800;background:transparent;width:100%;}
.ff select{appearance:none;cursor:pointer;}
.ff-go{display:flex;align-items:center;justify-content:center;padding:10px;}
.ff-go button{background:var(--red-g);color:#fff;border-radius:var(--r4);width:52px;height:52px;display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:var(--sh-red);transition:.25s;}
.ff-go button:hover{transform:scale(1.05);}
.cats{display:flex;gap:9px;overflow-x:auto;scrollbar-width:none;padding:16px 0 18px;}
.cats::-webkit-scrollbar{display:none;}
.cat{padding:9px 16px;border-radius:var(--r-pill);background:var(--white);border:1.5px solid var(--border);font-size:.82rem;font-weight:800;color:var(--tx2);white-space:nowrap;transition:.2s;}
.cat:hover{border-color:var(--tx3);}
.cat.on{background:var(--tx0);border-color:var(--tx0);color:#fff;}

/* بطاقات النتائج */
.sec{padding:clamp(24px,4vw,38px) 0;}
.count{font-size:.84rem;font-weight:700;color:var(--tx2);margin-bottom:16px;}
.count b{color:var(--tx0);font-weight:900;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;}
.card{background:var(--white);border:1px solid var(--border);border-radius:var(--r5);overflow:hidden;cursor:pointer;transition:transform .25s cubic-bezier(.34,1.3,.64,1),box-shadow .25s,border-color .25s;display:flex;flex-direction:column;}
.card:hover{transform:translateY(-5px);box-shadow:var(--sh-md);border-color:var(--tx4);}
.card-img{position:relative;aspect-ratio:4/3;background:var(--line);overflow:hidden;}
.card-img img{width:100%;height:100%;object-fit:cover;transition:transform .4s;}
.card:hover .card-img img{transform:scale(1.05);}
.card-img .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:3rem;opacity:.25;}
.card-tag{position:absolute;top:12px;inset-inline-start:12px;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);padding:5px 11px;border-radius:var(--r-pill);font-size:.7rem;font-weight:900;box-shadow:var(--sh-sm);}
.card-n{position:absolute;bottom:12px;inset-inline-end:12px;background:rgba(26,26,26,.82);color:#fff;padding:4px 10px;border-radius:var(--r-pill);font-size:.68rem;font-weight:800;}
.card-b{padding:16px 18px 18px;flex:1;display:flex;flex-direction:column;}
.card-t{font-weight:900;font-size:1rem;letter-spacing:-.01em;margin-bottom:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-s{font-size:.78rem;font-weight:600;color:var(--tx2);margin-bottom:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.card-f{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.card-f span{font-size:.68rem;font-weight:700;color:var(--tx1);background:var(--bg);padding:4px 9px;border-radius:var(--r-pill);}
.card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);}
.price{display:flex;align-items:baseline;gap:4px;}
.price b{font-size:1.15rem;font-weight:900;letter-spacing:-.02em;}
.price small{font-size:.7rem;font-weight:700;color:var(--tx2);}
.card-go{padding:9px 17px;border-radius:var(--r3);background:var(--red-g);color:#fff;font-size:.8rem;font-weight:900;box-shadow:var(--sh-red);transition:.2s;flex-shrink:0;}
.card-go:hover{transform:translateY(-1px);}

/* حالات */
.state{text-align:center;padding:clamp(50px,10vw,90px) 20px;}
.state .i{font-size:3.2rem;margin-bottom:16px;opacity:.3;}
.state b{display:block;font-size:1.15rem;font-weight:900;margin-bottom:8px;}
.state p{font-size:.88rem;font-weight:600;color:var(--tx2);max-width:340px;margin:0 auto 20px;line-height:1.7;}
.state .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:var(--r3);background:var(--tx0);color:#fff;font-size:.85rem;font-weight:900;}
.skel{background:var(--white);border:1px solid var(--border);border-radius:var(--r5);overflow:hidden;}
.skel .a{aspect-ratio:4/3;background:linear-gradient(90deg,var(--line) 25%,#F7F7F7 50%,var(--line) 75%);background-size:200% 100%;animation:sk 1.3s infinite;}
.skel .b{padding:16px 18px;}
.skel .l{height:12px;border-radius:6px;background:var(--line);margin-bottom:9px;}
.skel .l.s{width:55%;}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* الطبقة السفلية */
.sheet{position:fixed;inset:0;z-index:900;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;opacity:0;animation:fade .25s forwards;}
@keyframes fade{to{opacity:1}}
.sheet-in{background:var(--white);width:100%;max-width:640px;border-radius:var(--r6) var(--r6) 0 0;max-height:94vh;overflow-y:auto;transform:translateY(100%);animation:up .35s cubic-bezier(.2,.9,.3,1) forwards;}
@keyframes up{to{transform:none}}
.sheet-x{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);}
.sheet-x h3{font-size:1.05rem;font-weight:900;letter-spacing:-.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sheet-x button{width:36px;height:36px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.sheet-b{padding:20px;}

/* معرض الصور */
.gal{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin:-20px -20px 18px;padding:0 20px;scroll-snap-type:x mandatory;}
.gal::-webkit-scrollbar{display:none;}
.gal img{width:82%;max-width:340px;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r4);flex-shrink:0;scroll-snap-align:center;background:var(--line);}
.gal .k{position:relative;flex-shrink:0;}
.gal .k span{position:absolute;bottom:9px;inset-inline-start:9px;background:rgba(26,26,26,.8);color:#fff;font-size:.66rem;font-weight:800;padding:3px 9px;border-radius:var(--r-pill);}

.spec{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:18px;}
.spec div{background:var(--bg);border-radius:var(--r3);padding:11px 13px;}
.spec dt{font-size:.66rem;font-weight:800;color:var(--tx2);margin-bottom:2px;}
.spec dd{font-size:.86rem;font-weight:800;}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:18px;}
.chips span{font-size:.74rem;font-weight:700;background:var(--green-l);color:#00857A;padding:6px 12px;border-radius:var(--r-pill);}
.blk{margin-bottom:18px;}
.blk h4{font-size:.7rem;font-weight:900;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;}
.blk p{font-size:.88rem;font-weight:600;color:var(--tx1);line-height:1.75;}
.item{display:flex;gap:12px;align-items:center;padding:11px;border:1px solid var(--border);border-radius:var(--r3);margin-bottom:9px;transition:.18s;cursor:pointer;width:100%;text-align:start;}
.item:hover{border-color:var(--red);box-shadow:var(--sh-sm);}
.item img{width:62px;height:62px;border-radius:var(--r2);object-fit:cover;background:var(--line);flex-shrink:0;}
.item .ph{width:62px;height:62px;border-radius:var(--r2);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.4rem;opacity:.35;flex-shrink:0;}
.item .m{flex:1;min-width:0;}
.item .m b{display:block;font-size:.9rem;font-weight:900;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.item .m span{display:block;font-size:.74rem;font-weight:600;color:var(--tx2);}
.item .p{font-size:.92rem;font-weight:900;flex-shrink:0;}
.mapbox{border:1px solid var(--border);border-radius:var(--r4);overflow:hidden;margin-bottom:18px;}
.mapbox iframe{display:block;width:100%;height:180px;border:0;}
.bar{position:sticky;bottom:0;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:14px 20px calc(14px + env(safe-area-inset-bottom));margin:0 -20px -20px;display:flex;gap:12px;align-items:center;}
.bar .p{flex:1;min-width:0;}
.bar .p b{display:block;font-size:1.15rem;font-weight:900;letter-spacing:-.02em;}
.bar .p small{font-size:.7rem;font-weight:700;color:var(--tx2);}
.bar .go{padding:14px 28px;border-radius:var(--r3);background:var(--red-g);color:#fff;font-size:.92rem;font-weight:900;box-shadow:var(--sh-red);flex-shrink:0;transition:.2s;}
.bar .go:hover{transform:translateY(-1px);}
.bar .go:disabled{opacity:.5;transform:none;}

/* الاستمارة */
.fld{margin-bottom:15px;}
.fld label{display:block;font-size:.7rem;font-weight:900;color:var(--tx2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.05em;}
.fld label i{color:var(--red);font-style:normal;}
.fld input,.fld select,.fld textarea{width:100%;padding:13px 15px;border:1.5px solid var(--border);border-radius:var(--r3);font-size:.94rem;font-weight:700;background:var(--white);outline:none;transition:.18s;}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--red);box-shadow:0 0 0 3px var(--red-m);}
.fld textarea{min-height:78px;resize:vertical;font-weight:600;}
.fld .tel{direction:ltr;text-align:start;font-family:'IBM Plex Mono',monospace;letter-spacing:.04em;}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.total{background:var(--red-l);border:1px solid rgba(255,56,92,.2);border-radius:var(--r4);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.total span{font-size:.82rem;font-weight:800;color:var(--tx1);}
.total b{font-size:1.35rem;font-weight:900;color:var(--red);letter-spacing:-.02em;}
.note{background:var(--blue-l);border-radius:var(--r3);padding:12px 14px;font-size:.78rem;font-weight:700;color:#00478F;line-height:1.6;margin-bottom:16px;}
.ok{text-align:center;padding:26px 8px;}
.ok .i{font-size:3.4rem;margin-bottom:14px;}
.ok b{display:block;font-size:1.25rem;font-weight:900;margin-bottom:8px;}
.ok p{font-size:.88rem;font-weight:600;color:var(--tx2);line-height:1.75;margin-bottom:8px;}
.ok .id{display:inline-block;background:var(--bg);border-radius:var(--r-pill);padding:7px 16px;font-size:.8rem;font-weight:900;margin-bottom:20px;}
.wa{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;padding:15px;border-radius:var(--r3);background:#25D366;color:#fff;font-size:.95rem;font-weight:900;box-shadow:0 6px 18px rgba(37,211,102,.32);transition:.2s;}
.wa:hover{transform:translateY(-1px);}
.spin{width:17px;height:17px;border:2.5px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;display:inline-block;}
@keyframes sp{to{transform:rotate(360deg)}}

/* FOOTER — مطابق للرئيسية */
.footer{background:var(--white);border-top:1px solid var(--line);padding:40px clamp(16px,4vw,40px) 28px;margin-top:30px;}
.footer-inner{max-width:1200px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;}
.footer-brand{display:flex;flex-direction:column;gap:8px;max-width:280px;}
.footer-brand .row{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.1rem;}
.footer-brand .whale{width:36px;height:36px;border-radius:11px;background:var(--red-g);display:flex;align-items:center;justify-content:center;font-size:18px;}
.footer-brand .desc{font-size:.78rem;font-weight:600;color:var(--tx2);line-height:1.6;}
.footer-col h4{font-size:.7rem;font-weight:900;color:var(--tx2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;}
.footer-col a{display:block;font-size:.84rem;font-weight:700;color:var(--tx1);padding:5px 0;transition:.15s;}
.footer-col a:hover{color:var(--red);}
.footer-copy{max-width:1200px;margin:26px auto 0;padding-top:22px;border-top:1px solid var(--line);font-size:.74rem;font-weight:600;color:var(--tx3);text-align:center;}

#toast-wrap{position:fixed;top:calc(var(--nav-h) + 14px);inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:1000;pointer-events:none;}
.toast{background:var(--tx0);color:#fff;padding:12px 20px;border-radius:var(--r-pill);font-size:.82rem;font-weight:800;box-shadow:var(--sh-lg);display:flex;align-items:center;gap:9px;animation:tIn .35s cubic-bezier(.34,1.5,.64,1);max-width:90vw;}
.toast.err{background:var(--red);}
@keyframes tIn{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .6s,transform .6s;}
.reveal.in{opacity:1;transform:none;}

@media(max-width:680px){
.filters{grid-template-columns:1fr 1fr;}
.ff-go{grid-column:1/-1;border-top:1px solid var(--line);}
.ff-go button{width:100%;border-radius:var(--r4);}
.nav-partner{display:none;}
.footer-inner{flex-direction:column;gap:20px;}
.two{grid-template-columns:1fr;}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;}}
</style>
</head>
<body>
<div id="toast-wrap"></div>

<nav class="nav" id="nav">
  <a href="index.html" class="nav-logo"><span class="whale">🐋</span> الحوت</a>
  <div class="nav-right">
    <div class="lang-wrap">
      <button class="lang-btn" onclick="toggleLangMenu(event)">
        <span id="lang-flag">🇮🇶</span><span id="lang-name">عربي</span><span style="font-size:9px">▾</span>
      </button>
      <div class="lang-menu" id="lang-menu">
        <button class="lang-opt on" onclick="setLang('ar')"><span class="flag">🇮🇶</span> العربية</button>
        <button class="lang-opt" onclick="setLang('ku')"><span class="flag">🌞</span> کوردی</button>
        <button class="lang-opt" onclick="setLang('tr')"><span class="flag">🇹🇷</span> Türkçe</button>
        <button class="lang-opt" onclick="setLang('en')"><span class="flag">🇬🇧</span> English</button>
      </div>
    </div>
    <a href="partners.html" class="nav-partner" data-i18n="nav_partner">كن شريكاً</a>
  </div>
</nav>

<header class="pagehead">
  <div class="ph-inner">
    <h1 class="ph-title"><span>🚗</span> <span data-i18n="page_t">تأجير السيارات</span></h1>
    <p class="ph-sub" data-i18n="page_s">اختر سيارتك بأسعار يومية واضحة وبلا رسوم خفية</p>
    <div class="filters">
      <div class="ff">
        <label data-i18n="f_city">المدينة</label>
        <select id="citySel" onchange="applyFilters()"></select>
      </div>
      <div class="ff">
        <label data-i18n="f_search">ابحث</label>
        <input id="qIn" type="search" data-i18n-ph="ph_search" placeholder="اسم أو ميزة" oninput="debounced()">
      </div>
      <div class="ff-go"><button onclick="applyFilters()" aria-label="search">🔍</button></div>
    </div>
    <div class="cats" id="cats"></div>

const money = n => (Number(n)||0).toLocaleString("en-US");
const fbKey = s => String(s||"").replace(/[.#$/[\]\s]/g,"_");
const nP = p => { let c=String(p||"").replace(/\D/g,""); if(c.startsWith("964"))c=c.slice(3); if(c.startsWith("0"))c=c.slice(1); return c; };

function toast(msg, err){
  const w=$("toast-wrap"), el=document.createElement("div");
  el.className="toast"+(err?" err":"");
  el.innerHTML=`<span>${err?"⚠️":"✅"}</span><span>${esc(msg)}</span>`;
  w.appendChild(el);
  setTimeout(()=>{el.style.opacity="0";el.style.transition=".3s";setTimeout(()=>el.remove(),300);},3000);
}

/* ═══════════ اللغة ═══════════ */
window.toggleLangMenu = e => { e.stopPropagation(); $("lang-menu").classList.toggle("open"); };
document.addEventListener("click", ()=>$("lang-menu")?.classList.remove("open"));

window.setLang = function(lang){
  LANG = lang;
  const cfg = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = cfg.dir;
  document.body.classList.toggle("ltr", cfg.dir==="ltr");
  $("lang-flag").textContent = cfg.flag;
  $("lang-name").textContent = cfg.name;
  document.querySelectorAll(".lang-opt").forEach(o=>o.classList.remove("on"));
  document.querySelectorAll(".lang-opt").forEach(o=>{ if(o.getAttribute("onclick")==="setLang('"+lang+"')") o.classList.add("on"); });
  document.querySelectorAll("[data-i18n]").forEach(el=>{
    const k=el.getAttribute("data-i18n");
    if(I18N[lang][k]!==undefined) el.textContent=I18N[lang][k];
  });
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>{
    const k=el.getAttribute("data-i18n-ph");
    if(I18N[lang][k]!==undefined) el.placeholder=I18N[lang][k];
  });
  try{ localStorage.setItem("hut_lang", lang); }catch(e){}
  $("lang-menu").classList.remove("open");
  renderCitySelect();
  renderCats();
  render();
};

function renderCitySelect(){
  $("citySel").innerHTML = `<option value="">${esc(T("all"))}</option>` +
    CITIES.map(c=>`<option value="${esc(c.key)}">${c.ic} ${esc(c[LANG]||c.ar)}</option>`).join("");
  $("citySel").value = S.city;
}

function renderCats(){
  $("cats").innerHTML = `<button class="cat ${S.cat?"":"on"}" onclick="pickCat('')">${esc(T("all"))}</button>` +
    C.cats.map(c=>`<button class="cat ${S.cat===c?"on":""}" onclick="pickCat('${esc(c)}')">${esc(c)}</button>`).join("");
}
window.pickCat = c => { S.cat = c; renderCats(); render(); };

let dT=null;
window.debounced = () => { clearTimeout(dT); dT=setTimeout(()=>{ S.q=$("qIn").value.trim(); render(); },250); };
window.applyFilters = () => { S.city = $("citySel").value; load(); };

/* ═══════════ التحميل من Firebase ═══════════
   عقدة catalog مقروءة علناً وتحمل بيانات الأنشطة فقط — لا زبائن ولا
   أسعار داخلية. لذلك لا نحتاج SDK ولا مصادقة، مجرد fetch. */
async function load(){
  S.loading = true; S.err = false; render();
  try{
    let list = [];
    if(S.city){
      const r = await fetch(`${FB_URL}/catalog/${SECTOR}/${encodeURIComponent(fbKey(S.city))}.json`);
      const d = await r.json();
      list = d ? Object.keys(d).map(k=>d[k]) : [];
    }else{
      const r = await fetch(`${FB_URL}/catalog/${SECTOR}.json`);
      const d = await r.json();
      if(d) Object.keys(d).forEach(city=>{
        const node = d[city] || {};
        Object.keys(node).forEach(k=>list.push(node[k]));
      });
    }
    S.data = list.filter(p=>p && p.id);
    S.loading = false;
    render();
  }catch(e){
    S.loading = false; S.err = true; render();
  }
}

/* ═══════════ العرض ═══════════ */
function partnerCity(p){
  const c = CITIES.find(x=>x.key===p.city);
  return c ? (c[LANG]||c.ar) : (p.city||"");
}

function flatten(){
  /* السيارات: نفرد العناصر لتظهر كل سيارة بطاقة مستقلة */
  if(C.primary !== "items") return S.data.slice();
  const out = [];
  S.data.forEach(p=>(p.items||[]).forEach(it=>{
    out.push(Object.assign({}, it, {_p:p}));
  }));
  return out;
}

function matches(x){
  const q = S.q.toLowerCase();
  if(S.cat){
    if(C.primary==="items"){ if(String(x.type||"") !== S.cat) return false; }
    else{
      const cat = (x.specs||{}).cat;
      const hasType = (x.items||[]).some(i=>String(i.type||"")===S.cat);
      if(String(cat||"") !== S.cat && !hasType) return false;
    }
  }
  if(!q) return true;
  const hay = C.primary==="items"
    ? [x.name, x.type, x._p.name, x._p.area, JSON.stringify(x.features||[]), JSON.stringify(x.specs||{})]
    : [x.name, x.area, x.desc, JSON.stringify(x.features||[]), (x.items||[]).map(i=>i.name).join(" ")];
  return hay.join(" ").toLowerCase().includes(q);
}

function render(){
  const g = $("grid"), cnt = $("count");

  if(S.loading){
    cnt.textContent = T("loading");
    g.innerHTML = Array(6).fill(`<div class="skel"><div class="a"></div><div class="b"><div class="l"></div><div class="l s"></div></div></div>`).join("");
    return;
  }
  if(S.err){
    cnt.textContent = "";
    g.innerHTML = `<div class="state" style="grid-column:1/-1"><div class="i">📡</div>
      <b>${esc(T("err_t"))}</b><p>${esc(T("err_p"))}</p>
      <button class="btn" onclick="load()">${esc(T("err_b"))}</button></div>`;
    return;
  }

  const list = flatten().filter(matches);
  cnt.innerHTML = `<b>${list.length}</b> ${esc(T("results"))}`;

  if(!list.length){
    g.innerHTML = `<div class="state" style="grid-column:1/-1"><div class="i">${C.icon}</div>
      <b>${esc(T("empty_t"))}</b><p>${esc(T("empty_p"))}</p>
      ${S.city?`<button class="btn" onclick="clearCity()">${esc(T("empty_b"))}</button>`:""}</div>`;
    return;
  }

  g.innerHTML = list.map((x,i)=> C.primary==="items" ? itemCard(x,i) : partnerCard(x,i)).join("");
}

window.clearCity = () => { S.city=""; $("citySel").value=""; load(); };

function itemCard(it, i){
  const p = it._p, s = it.specs||{};
  const bits = [];
  if(s.year)  bits.push(s.year);
  if(s.trans) bits.push(s.trans);
  if(s.seats) bits.push(s.seats + " مقاعد");
  if(s.fuel)  bits.push(s.fuel);
  const img = it.cover || (it.media&&it.media[0]&&it.media[0].u) || "";
  return `<article class="card" onclick="openItem('${esc(p.id)}','${esc(it.id)}')">
    <div class="card-img">
      ${img?`<img src="${esc(img)}" alt="${esc(it.name)}" loading="${i<4?"eager":"lazy"}">`:`<div class="ph">${C.icon}</div>`}
      ${it.type?`<span class="card-tag">${esc(it.type)}</span>`:""}
      ${(it.media&&it.media.length>1)?`<span class="card-n">📷 ${it.media.length}</span>`:""}
    </div>
    <div class="card-b">
      <div class="card-t">${esc(it.name)}</div>
      <div class="card-s">${esc(p.name)} · ${esc(p.area||partnerCity(p))}</div>
      <div class="card-f">${bits.slice(0,3).map(b=>`<span>${esc(b)}</span>`).join("")}</div>
      <div class="card-foot">
        <div class="price"><b class="mono">${money(it.price)}</b><small>${esc(T("iqd"))} ${esc(T(C.unitKey))}</small></div>
        <span class="card-go">${esc(T("book"))}</span>
      </div>
    </div></article>`;
}

function partnerCard(p, i){
  const s = p.specs||{};
  const bits = (p.features||[]).slice(0,3);
  const img = p.cover || (p.media&&p.media[0]&&p.media[0].u) || "";
  const price = p.min_price && p.min_price < 999999999 ? p.min_price : 0;
  const stars = s.stars ? "⭐".repeat(Math.min(5, parseInt(s.stars)||0)) : "";
  return `<article class="card" onclick="openPartner('${esc(p.id)}')">
    <div class="card-img">
      ${img?`<img src="${esc(img)}" alt="${esc(p.name)}" loading="${i<4?"eager":"lazy"}">`:`<div class="ph">${C.icon}</div>`}
      ${stars?`<span class="card-tag">${stars}</span>`:(s.cat?`<span class="card-tag">${esc(s.cat)}</span>`:"")}
      ${p.item_count?`<span class="card-n">${p.item_count} ${esc(T("items_"+SECTOR).split(" ")[0])}</span>`:""}
    </div>
    <div class="card-b">
      <div class="card-t">${esc(p.name)}</div>
      <div class="card-s">${esc(p.area||"")} ${p.area?"·":""} ${esc(partnerCity(p))}</div>
      <div class="card-f">${bits.map(b=>`<span>${esc(b)}</span>`).join("")}</div>
      <div class="card-foot">
        ${price?`<div class="price"><small>${esc(T("from"))}</small><b class="mono">${money(price)}</b><small>${esc(T("iqd"))}</small></div>`
               :`<div class="price"><small>${esc(T("details"))}</small></div>`}
        <span class="card-go">${esc(T("book"))}</span>
      </div>
    </div></article>`;
}

/* ═══════════ التفاصيل ═══════════ */
function findPartner(id){ return S.data.find(p=>String(p.id)===String(id)); }

window.openItem = function(pid, iid){
  const p = findPartner(pid);
  if(!p) return;
  const it = (p.items||[]).find(x=>String(x.id)===String(iid));
  if(!it) return;
  S.cur = p; S.curItem = it;
  showDetail(p, it);
};

window.openPartner = function(pid){
  const p = findPartner(pid);
  if(!p) return;
  S.cur = p; S.curItem = null;
  showDetail(p, null);
};

function specRows(obj, only){
  const LBL = {
    year:"سنة الصنع",trans:"ناقل الحركة",fuel:"الوقود",engine:"المحرك",seats:"عدد الركاب",
    color:"اللون",km_limit:"حدّ الكيلومترات",deposit:"التأمين",price_week:"سعر الأسبوع",price_month:"سعر الشهر",
    stars:"النجوم",cat:"الفئة",rooms_count:"عدد الغرف",checkin:"الدخول",checkout:"الخروج",
    breakfast:"إفطار مشمول",parking:"الموقف",extra_bed:"سرير إضافي",child_free:"مجاني للأطفال حتى",
    beds:"الأسرّة",max_guests:"أقصى عدد",size_m2:"المساحة",view:"الإطلالة",price_weekend:"سعر نهاية الأسبوع",
    cap_min:"أقل عدد ضيوف",cap_max:"أقصى عدد ضيوف",price_night:"سعر السهرة",catering:"الضيافة",
    meal_price:"سعر الوجبة",sound:"الصوت والإضاءة",deposit_pct:"العربون",hours:"المدة",
    license:"أنواع الإجازات",instructors:"عدد المدرّبين",female_inst:"مدرّبات نساء",cars_count:"سيارات التدريب",
    pickup:"نقل من البيت",pickup_fee:"أجرة النقل",theory:"دروس نظرية",exam_help:"مرافقة الامتحان",
    gov_fee:"رسوم الدائرة",level:"المستوى",lessons:"عدد الدروس",days:"مدة الكورس",car_type:"نوع السيارة",
    age_min:"أقل عمر",gender:"مخصّص لـ",min_guests:"أقل عدد ضيوف",per_person:"السعر للفرد",
    payment:"طرق الدفع",smoking:"التدخين",floor:"الطابق"
  };
  const out = [];
  Object.keys(obj||{}).forEach(k=>{
    if(only && only.indexOf(k) === -1) return;
    let v = obj[k];
    if(v === "" || v === null || v === undefined) return;
    if(Array.isArray(v)){ if(!v.length) return; v = v.join("، "); }
    if(v === true) v = "نعم";
    if(v === false) return;
    out.push(`<div><dt>${esc(LBL[k]||k)}</dt><dd>${esc(v)}</dd></div>`);
  });
  return out.join("");
}

function showDetail(p, it){
  const media = it ? (it.media||[]) : (p.media||[]);
  const title = it ? it.name : p.name;
  const price = it ? it.price : (p.min_price && p.min_price<999999999 ? p.min_price : 0);
  const s = it ? (it.specs||{}) : (p.specs||{});
  const feats = it ? (it.features||[]) : (p.features||[]);

  const mapHtml = (p.lat && p.lng) ? `
    <div class="blk"><h4>${esc(T("location"))}</h4>
      <div class="mapbox"><iframe loading="lazy" title="map"
        src="https://www.openstreetmap.org/export/embed.html?bbox=${p.lng-0.004},${p.lat-0.004},${p.lng+0.004},${p.lat+0.004}&layer=mapnik&marker=${p.lat},${p.lng}"></iframe></div>
      <p style="font-size:.82rem;font-weight:700;color:var(--tx2)">${esc(p.address||"")}</p>
      <a href="https://www.google.com/maps?q=${p.lat},${p.lng}" target="_blank" rel="noopener"
         style="display:inline-block;margin-top:8px;font-size:.8rem;font-weight:900;color:var(--red)">${esc(T("openmap"))} ←</a>
    </div>` : "";

  const itemsHtml = (!it && (p.items||[]).length) ? `
    <div class="blk"><h4>${esc(T("items_"+SECTOR))}</h4>
      ${(p.items||[]).map(x=>{
        const im = x.cover || (x.media&&x.media[0]&&x.media[0].u) || "";
        return `<button class="item" onclick="pickItem('${esc(x.id)}')">
          ${im?`<img src="${esc(im)}" alt="" loading="lazy">`:`<div class="ph">${C.icon}</div>`}
          <div class="m"><b>${esc(x.name)}</b><span>${esc(x.type||"")}</span></div>
          <div class="p mono">${money(x.price)}</div>
        </button>`;
      }).join("")}
    </div>` : (!it ? `<div class="blk"><p style="color:var(--tx3)">${esc(T("no_items"))}</p></div>` : "");

  sheet(title, `
    ${media.length?`<div class="gal">${media.slice(0,12).map(m=>
      `<div class="k"><img src="${esc(m.u||m.url)}" alt="" loading="lazy">${m.k?`<span>${esc(m.k)}</span>`:""}</div>`).join("")}</div>`:""}
    <div style="font-size:.82rem;font-weight:700;color:var(--tx2);margin-bottom:14px">
      ${it?esc(p.name)+" · ":""}${esc(p.area||"")} ${p.area?"·":""} ${esc(partnerCity(p))}
    </div>
    ${(p.desc && !it)?`<div class="blk"><h4>${esc(T("about"))}</h4><p>${esc(p.desc)}</p></div>`:""}
    ${(it && it.desc)?`<div class="blk"><h4>${esc(T("about"))}</h4><p>${esc(it.desc)}</p></div>`:""}
    ${specRows(s)?`<div class="spec">${specRows(s)}</div>`:""}
    ${feats.length?`<div class="blk"><h4>${esc(T("features"))}</h4>
      <div class="chips">${feats.map(f=>`<span>${esc(f)}</span>`).join("")}</div></div>`:""}
    ${itemsHtml}
    ${mapHtml}
    <div class="bar">
      <div class="p">
        ${price?`<b class="mono">${money(price)} <span style="font-size:.8rem">${esc(T("iqd"))}</span></b>
                 <small>${esc(T(C.unitKey))}</small>`:`<b style="font-size:.95rem">${esc(T("book"))}</b>`}
      </div>
      <button class="go" onclick="openForm()">${esc(T("book"))}</button>
    </div>`);
}

window.pickItem = function(iid){
  const it = (S.cur.items||[]).find(x=>String(x.id)===String(iid));
  if(!it) return;
  S.curItem = it;
  showDetail(S.cur, it);
};

/* ═══════════ الاستمارة ═══════════ */
window.openForm = function(){
  const p = S.cur, it = S.curItem;
  const unit = it ? it.price : (p.min_price && p.min_price<999999999 ? p.min_price : 0);
  const qtyField = C.qtyKey ? `
    <div class="fld"><label data-i18n="${C.qtyKey}">${esc(T(C.qtyKey))}</label>
      <input id="fQty" type="number" min="1" max="${SECTOR==="hall"?"2000":"90"}" value="${SECTOR==="hall"?"200":"1"}" oninput="calcTotal()"></div>` : "";

  sheet(T("form_t"), `
    <div class="fld"><label>${esc(T("f_name"))} <i>*</i></label>
      <input id="fName" placeholder="${esc(T("ph_name"))}" autocomplete="name"></div>
    <div class="fld"><label>${esc(T("f_phone"))} <i>*</i></label>
      <input id="fPhone" class="tel" type="tel" inputmode="numeric" placeholder="${esc(T("ph_phone"))}" autocomplete="tel"></div>
    <div class="two">
      <div class="fld"><label>${esc(T("f_date"))} <i>*</i></label>
        <input id="fDate" type="date" value="${esc(S.date||todayStr())}" min="${todayStr()}"></div>
      ${qtyField}
    </div>
    ${SECTOR==="car"||SECTOR==="hotel"?`<div class="fld"><label>${esc(T("f_nid"))}</label>
      <input id="fNid" placeholder="${esc(T("ph_nid"))}" inputmode="numeric"></div>`:""}
    <div class="fld"><label>${esc(T("f_notes"))}</label>
      <textarea id="fNotes" placeholder="${esc(T("ph_notes"))}"></textarea></div>
    ${unit?`<div class="total"><span>${esc(T("total"))}</span><b class="mono" id="fTotal">${money(unit)} ${esc(T("iqd"))}</b></div>`:""}
    <div class="note">${esc(T("note_wa"))}</div>
    <button class="wa" id="fSend" style="background:var(--red-g);box-shadow:var(--sh-red)" onclick="submitOrder()">${esc(T("send"))}</button>`);

  setTimeout(()=>{ $("fName")?.focus(); }, 320);
};

function todayStr(){ return new Date().toISOString().split("T")[0]; }

window.calcTotal = function(){
  const el = $("fTotal");
  if(!el) return;
  const it = S.curItem;
  const unit = it ? it.price : (S.cur.min_price||0);
  const q = SECTOR==="hall" ? 1 : Math.max(1, parseInt(($("fQty")||{}).value)||1);
  el.textContent = money(unit*q) + " " + T("iqd");
};

async function submitOrder(){
  const p = S.cur, it = S.curItem;
  const name  = ($("fName").value||"").trim();
  const phone = nP($("fPhone").value);
  const date  = ($("fDate").value||"").trim();
  const qty   = Math.max(1, parseInt(($("fQty")||{}).value)||1);
  const nid   = ($("fNid")||{}).value || "";
  const notes = ($("fNotes")||{}).value || "";

  if(name.length < 3)   return toast(T("e_name"), true);
  if(phone.length < 9)  return toast(T("e_phone"), true);
  if(!date)             return toast(T("e_date"), true);

  const unit  = it ? it.price : (p.min_price||0);
  const total = SECTOR==="hall" ? unit : unit*qty;

  const body = {token:TOKEN, action:C.action, source:"web",
    name:name, phone:phone, city:p.city, province:p.city, date:date,
    total_price:total, national_id:nid, special_req:notes};

  if(SECTOR==="car"){
    body.car = it ? it.name : "";
    body.days = qty;
    body.service = "شخصي";
    body.office = p.name;
    body.partner_id = p.id;
    body.addon_display = notes;
  }else if(SECTOR==="hotel"){
    body.hotel_name = p.name; body.hotel_id = p.id;
    body.room_type = it ? (it.type||it.name) : "";
    body.nights = qty; body.guests = (it && it.specs && it.specs.max_guests) || 1;
  }else if(SECTOR==="hall"){
    body.hall_name = p.name; body.hall_id = p.id;
    body.event_type = it ? it.name : "مناسبة";
    body.guests = qty;
  }else{
    body.school_id = p.id; body.school_name = p.name;
    body.course = it ? it.name : "كورس";
  }

  const btn = $("fSend");
  btn.innerHTML = `<span class="spin"></span> ${esc(T("sending"))}`;
  btn.disabled = true;

  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(body)});
    const d = await r.json();
    if(!d || !d.success) throw new Error((d&&d.msg)||T("fail"));
    showSuccess(d.order_id, p, it, {name, phone, date, qty, total, notes});
  }catch(e){
    btn.innerHTML = esc(T("send"));
    btn.disabled = false;
    toast(e.message || T("fail"), true);
  }
}

function showSuccess(orderId, p, it, f){
  const svc = it ? it.name : p.name;
  const unitTxt = T(C.unitKey);
  const lines = [
    "🐋 منصة الحوت",
    "طلب جديد #" + orderId,
    "",
    "الخدمة: " + svc,
    "مقدّم الخدمة: " + p.name,
    "المدينة: " + p.city + (p.area ? " — " + p.area : ""),
    "التاريخ: " + f.date,
    (C.qtyKey ? T(C.qtyKey) + ": " + f.qty : ""),
    "الإجمالي التقديري: " + money(f.total) + " د.ع " + unitTxt,
    "",
    "الاسم: " + f.name,
    "الهاتف: 0" + f.phone,
    (f.notes ? "ملاحظات: " + f.notes : "")
  ].filter(Boolean).join("\n");

  const target = TEST_MODE ? TEST_PHONE : ("964" + nP(p.phone));
  const link = "https://wa.me/" + target + "?text=" + encodeURIComponent(lines);

  sheet(T("ok_t"), `
    <div class="ok">
      <div class="i">🎉</div>
      <b>${esc(T("ok_t"))}</b>
      <p>${esc(T("ok_p"))}</p>
      <div class="id mono">#${esc(orderId)}</div>
      <a class="wa" href="${link}" target="_blank" rel="noopener">
        <span style="font-size:1.15rem">💬</span> ${esc(T("ok_wa"))}
      </a>
      ${TEST_MODE?`<p style="margin-top:14px;font-size:.72rem;color:var(--tx3)">
        وضع التجربة: الرسالة تذهب لرقم الاختبار لا للشريك.</p>`:""}
    </div>`);
}

/* ═══════════ الطبقة ═══════════ */
function sheet(title, html){
  $("sheetHost").innerHTML = `<div class="sheet" id="sh">
    <div class="sheet-in" role="dialog" aria-modal="true">
      <div class="sheet-x"><h3>${esc(title)}</h3>
        <button onclick="closeSheet()" aria-label="close">✕</button></div>
      <div class="sheet-b">${html}</div>
    </div></div>`;
  document.body.style.overflow = "hidden";
  $("sh").onclick = e => { if(e.target.id==="sh") closeSheet(); };
}
window.closeSheet = function(){ $("sheetHost").innerHTML=""; document.body.style.overflow=""; };
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeSheet(); });

window.addEventListener("scroll", ()=>{ $("nav").classList.toggle("scrolled", window.scrollY>10); });

/* ═══════════ الإقلاع ═══════════ */
(function init(){
  const q = new URLSearchParams(location.search);
  S.city = q.get("city") || "";
  S.date = q.get("date") || "";
  S.qty  = parseInt(q.get("days")||q.get("nights")||"1") || 1;

  let saved = "ar";
  try{ saved = q.get("lang") || localStorage.getItem("hut_lang") || "ar"; }catch(e){ saved = q.get("lang")||"ar"; }
  if(!I18N[saved]) saved = "ar";
  setLang(saved);

  if(API.indexOf("ضع_")===0) toast("املأ API و TOKEN في أعلى الملف", true);
  load();
})();
</script>
</body>
