<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex,nofollow">
<title>لوحة الإدخال — منصة الحوت</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --bg-soft:#F7F7F7; --bg-2:#F0F0EF;
  --line:#DDDDDD; --line-soft:#EBEBEB;
  --text:#222222; --text-2:#717171; --text-3:#A0A0A0;
  --rose:#FF385C; --rose-d:#D70466; --green:#008A05; --amber:#B35309; --red:#C13515; --blue:#185FA5;
  --r-s:8px; --r-m:12px; --r-l:16px; --r-pill:999px;
  --sh:0 2px 8px rgba(0,0,0,.08); --sh-up:0 6px 20px rgba(0,0,0,.14);
  --ar:"Tajawal",system-ui,sans-serif; --num:"Poppins",ui-monospace,monospace;
  --nav:64px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--ar);font-size:15px;line-height:1.6}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:inherit}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--text);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hidden{display:none!important}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.pad{padding-bottom:calc(var(--nav) + 24px)}

.hdr{position:sticky;top:0;z-index:40;background:var(--bg);border-bottom:1px solid var(--line-soft);padding-top:env(safe-area-inset-top)}
.hdr-in{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:10px}
.mark{font-weight:800;font-size:20px;flex:none}
.hdr-mid{flex:1;min-width:0}
.hdr-mid b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hdr-mid span{font-size:12px;color:var(--text-2)}
.ic{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--bg);
  display:grid;place-items:center;font-size:16px;flex:none;transition:box-shadow .18s}
.ic:hover{box-shadow:var(--sh)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block;vertical-align:1px;margin-inline-end:4px}
.dot.off{background:var(--text-3)}

.chips{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{padding:7px 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--bg);
  font-size:13.5px;white-space:nowrap;color:var(--text-2);transition:.15s;display:inline-flex;gap:6px;align-items:center}
.chip.on{background:var(--text);color:#fff;border-color:var(--text);font-weight:500}
.chip .n{font-family:var(--num);font-size:11.5px;opacity:.7}

.search{position:relative;margin:12px 0 4px}
.search input{width:100%;padding:13px 44px 13px 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--bg);font-size:15px}
.search input:focus{border-color:var(--text);outline:none;box-shadow:0 0 0 1px var(--text)}
.search .i{position:absolute;inset-inline-end:16px;top:50%;transform:translateY(-50%);opacity:.4;font-size:16px}


/* ═══ بطاقة الشريك في القائمة ═══ */
.row{position:relative;display:flex;gap:13px;align-items:center;padding:13px;padding-inline-start:17px;
  border:1px solid var(--line-soft);border-radius:var(--r-l);margin-bottom:11px;
  transition:transform .18s cubic-bezier(.34,1.3,.64,1),box-shadow .18s,border-color .18s;
  text-align:start;width:100%;background:var(--bg);overflow:hidden}
.row::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--line)}
.row[data-st="active"]::before{background:var(--green)}
.row[data-st="pending"]::before{background:var(--amber)}
.row[data-st="blocked"]::before{background:var(--red)}
.row:hover{transform:translateY(-2px);box-shadow:var(--sh-up);border-color:var(--line)}
.row:active{transform:none}
.row-img{width:66px;height:66px;border-radius:var(--r-m);object-fit:cover;background:var(--bg-2);flex:none}
.row-ph{width:66px;height:66px;border-radius:var(--r-m);display:grid;place-items:center;font-size:24px;flex:none}
.row-mid{flex:1;min-width:0}
.row-mid b{display:block;font-size:15.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:3px}
.rmeta{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.rmeta span{font-size:11.5px;font-weight:600;color:var(--text-2);background:var(--bg-soft);
  padding:3px 8px;border-radius:var(--r-pill);white-space:nowrap}
.rmeta span.warn{background:#FFF4E5;color:var(--amber)}
.rmeta span.num{font-family:var(--num);direction:ltr}
.ring2{width:42px;height:42px;position:relative;display:grid;place-items:center;flex:none}
.ring2 svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring2 circle{fill:none;stroke-width:3}
.ring2 b{font-size:11px;font-family:var(--num);font-weight:700}

.quick{width:100%;margin:-6px 0 12px;padding:11px;border-radius:var(--r-s);
  border:1px dashed var(--rose);background:#FFF6F8;color:var(--rose-d);font-size:13.5px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.quick:hover{background:#FFEDF1}
.quick span{font-size:16px;font-weight:800}
.row{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line-soft);
  border-radius:var(--r-m);margin-bottom:10px;transition:.15s;text-align:start;width:100%;background:var(--bg)}
.row:hover{box-shadow:var(--sh);border-color:var(--line)}
.row-img{width:62px;height:62px;border-radius:var(--r-s);object-fit:cover;background:var(--bg-2);flex:none}
.row-ph{width:62px;height:62px;border-radius:var(--r-s);background:var(--bg-2);display:grid;place-items:center;font-size:22px;opacity:.45;flex:none}
.row-mid{flex:1;min-width:0}
.row-mid b{display:block;font-size:15.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-mid span{display:block;font-size:12.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-end{flex:none;text-align:end}
.pct{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:11px;
  font-family:var(--num);font-weight:600;margin-inline-start:auto}
.state{font-size:11.5px;padding:3px 9px;border-radius:var(--r-pill);white-space:nowrap;font-weight:500;
  background:var(--bg-soft);color:var(--text-2);display:inline-block}
.state.wait{background:#FFF4E5;color:var(--amber)}
.state.ok{background:#E9F5EA;color:var(--green)}
.state.no{background:#FDEAE6;color:var(--red)}



/* ═══ بطاقات فرعية داخل القسم ═══ */
.sub{border:1px solid var(--line-soft);border-radius:var(--r-l);margin-bottom:12px;overflow:hidden;
  background:var(--bg);opacity:0;transform:translateY(10px);animation:subIn .34s cubic-bezier(.2,.9,.3,1) forwards}
.sub:nth-child(1){animation-delay:.02s} .sub:nth-child(2){animation-delay:.07s}
.sub:nth-child(3){animation-delay:.12s} .sub:nth-child(4){animation-delay:.17s}
.sub:nth-child(5){animation-delay:.22s} .sub:nth-child(6){animation-delay:.27s}
@keyframes subIn{to{opacity:1;transform:none}}
.sub-h{display:flex;align-items:center;gap:10px;padding:13px 15px;border-bottom:1px solid var(--line-soft)}
.sub-i{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;font-size:15px;flex:none}
.sub-h b{flex:1;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.sub-h .n{font-size:11.5px;color:var(--text-3);font-family:var(--num)}
.sub-b{padding:15px}

/* لون لكل قسم — يثبّت المكان في ذهن الموظف */
.pane[data-a="rose"]  .sub-i{background:#FFF0F3;color:var(--rose-d)}
.pane[data-a="blue"]  .sub-i{background:#EDF3FA;color:var(--blue)}
.pane[data-a="green"] .sub-i{background:#E9F5EA;color:#00700B}
.pane[data-a="amber"] .sub-i{background:#FFF4E5;color:var(--amber)}
.pane[data-a="violet"].sub-i,.pane[data-a="violet"] .sub-i{background:#F3F0FF;color:#5B3FA8}
.pane[data-a="slate"] .sub-i{background:var(--bg-2);color:var(--text-1,#484848)}
.pane[data-a="rose"]  .pane-h h3::after{background:var(--rose)}
.pane[data-a="blue"]  .pane-h h3::after{background:var(--blue)}
.pane[data-a="green"] .pane-h h3::after{background:var(--green)}
.pane[data-a="amber"] .pane-h h3::after{background:var(--amber)}
.pane[data-a="violet"].pane-h h3::after,.pane[data-a="violet"] .pane-h h3::after{background:#6B46C1}
.pane[data-a="slate"] .pane-h h3::after{background:var(--text-3)}
.pane-h h3{position:relative;padding-inline-start:13px}
.pane-h h3::after{content:"";position:absolute;inset-inline-start:0;top:5px;bottom:5px;width:4px;border-radius:3px}

/* حركات */
.tab{transition:transform .14s,background .15s,border-color .15s}
.tab:active{transform:scale(.95)}
.pill{transition:transform .13s,background .13s,border-color .13s,color .13s}
.pill:active{transform:scale(.94)}
.pill.on{animation:pillPop .26s cubic-bezier(.34,1.5,.64,1)}
@keyframes pillPop{0%{transform:scale(1)}45%{transform:scale(1.09)}100%{transform:scale(1)}}
.ering circle{transition:stroke-dashoffset .5s cubic-bezier(.2,.9,.3,1),stroke .3s}
.savebar .meter i u{transition:width .45s cubic-bezier(.2,.9,.3,1),background .3s}
.ph{animation:phIn .3s ease}
@keyframes phIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

/* ═══ محرّر مقسّم: قسم واحد على الشاشة + ملاحة دائمة ═══ */
.ehead{position:sticky;top:calc(var(--nav) + env(safe-area-inset-top));z-index:30;background:var(--bg);
  border-bottom:1px solid var(--line-soft);margin:0 -16px;padding:0 16px;}
.ehead-in{display:flex;align-items:center;gap:12px;padding:12px 0 10px;}
.ering{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
  font-size:11.5px;font-family:var(--num);font-weight:700;position:relative;}
.ering svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ering circle{fill:none;stroke-width:3.5}
.ehead-t{flex:1;min-width:0}
.ehead-t b{display:block;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ehead-t span{font-size:12px;color:var(--text-2)}

.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:0 0 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:8px 14px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--bg);
  font-size:13px;font-weight:600;color:var(--text-2);white-space:nowrap;display:inline-flex;
  align-items:center;gap:7px;transition:.15s;flex:none}
.tab:hover{border-color:var(--text-3)}
.tab.on{background:var(--text);border-color:var(--text);color:#fff;font-weight:700}
.tab .dot{width:7px;height:7px;border-radius:50%;flex:none}
.tab .dot.miss{background:var(--rose)}
.tab .dot.done{background:var(--green)}
.tab.on .dot.done{background:#7BE38C}

.pane{display:none;animation:paneIn .2s ease}
.pane.on{display:block}
@keyframes paneIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.pane-h{margin:16px 0 14px}
.pane-h h3{font-size:19px;font-weight:700;letter-spacing:-.01em}
.pane-h p{font-size:13px;color:var(--text-2);margin:4px 0 0;line-height:1.6}
.pane-body{border:1px solid var(--line-soft);border-radius:var(--r-l);padding:16px;margin-bottom:14px}

.stepnav{display:flex;gap:10px;margin:0 0 18px}
.stepnav button{flex:1;padding:12px;border-radius:var(--r-s);border:1px solid var(--line);
  background:var(--bg);font-size:14px;font-weight:600;color:var(--text-2);transition:.15s}
.stepnav button:hover:not(:disabled){border-color:var(--text);color:var(--text)}
.stepnav button:disabled{opacity:.35}
.stepnav button.next{background:var(--text);border-color:var(--text);color:#fff;font-weight:700}

.miss-note{display:flex;gap:9px;align-items:flex-start;background:#FFF6F8;border:1px solid #F5C2CE;
  border-radius:var(--r-s);padding:11px 13px;font-size:13px;color:var(--rose-d);
  font-weight:600;line-height:1.6;margin-bottom:14px}
.miss-note em{font-style:normal;flex:none}

/* شريط إحصاء القائمة */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
.stats button{border:1px solid var(--line-soft);border-radius:var(--r-m);padding:11px 8px;text-align:center;transition:.15s}
.stats button:hover{border-color:var(--text-3)}
.stats button.on{border-color:var(--text);border-width:2px;background:var(--bg-soft)}
.stats b{display:block;font-size:19px;font-family:var(--num);font-weight:600;line-height:1.2}
.stats span{display:block;font-size:11px;color:var(--text-2);margin-top:2px}

@media(min-width:900px){
  .ework{display:flex;gap:24px;align-items:flex-start}
  .tabs{flex-direction:column;gap:4px;width:212px;flex:none;overflow:visible;padding:0;
    position:sticky;top:calc(var(--nav) + 92px)}
  .tab{width:100%;justify-content:flex-start;border-radius:var(--r-s);padding:11px 14px}
  .ework-main{flex:1;min-width:0}
  .pane-h{margin-top:0}
}

.grp{border:1px solid var(--line-soft);border-radius:var(--r-l);margin-bottom:12px;overflow:hidden}
.grp-hd{display:flex;align-items:center;gap:10px;padding:15px 16px;background:var(--bg);width:100%;text-align:start}
.grp-hd b{flex:1;font-size:16px;font-weight:700}
.grp-hd .cnt{font-size:12px;color:var(--text-3)}
.grp-hd .arw{font-size:13px;color:var(--text-3);transition:transform .2s}
.grp.open .grp-hd .arw{transform:rotate(180deg)}
.grp-bd{padding:0 16px 16px;display:none}
.grp.open .grp-bd{display:block}

.fg{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fld label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:5px;font-weight:500}
.fld label .rq{color:var(--rose)}
.fld label .hint{color:var(--text-3);font-weight:400}
.fld.w{grid-column:1/-1}
.fld input,.fld select,.fld textarea{width:100%;padding:12px;border-radius:var(--r-s);
  border:1px solid var(--line);background:var(--bg);font-size:15px}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--text);outline:none;box-shadow:0 0 0 1px var(--text)}
.fld .unit{position:relative}
.fld .unit span{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);
  font-size:12.5px;color:var(--text-3);pointer-events:none}
.fld .unit input{padding-inline-start:48px}
.fld textarea{min-height:82px;resize:vertical}
.tel-in{direction:ltr;text-align:start;font-family:var(--num);letter-spacing:.03em}

.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 12px;width:100%;
  border:1px solid var(--line);border-radius:var(--r-s);background:var(--bg);text-align:start}
.sw span{font-size:14px}
.sw i{width:44px;height:26px;border-radius:var(--r-pill);background:var(--line);position:relative;flex:none;transition:.2s}
.sw i::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;
  border-radius:50%;background:#fff;transition:.2s;box-shadow:var(--sh)}
.sw.on i{background:var(--green)}
.sw.on i::after{inset-inline-start:21px}

.pills{display:flex;flex-wrap:wrap;gap:7px}
.pill{padding:8px 13px;border-radius:var(--r-pill);border:1px solid var(--line);background:var(--bg);
  font-size:13.5px;color:var(--text-2);transition:.13s}
.pill.on{background:#FFF0F3;border-color:var(--rose);color:var(--rose-d);font-weight:500}

.map{border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden;margin-top:10px}
.map iframe{display:block;width:100%;height:190px;border:0}
.map-empty{height:110px;display:grid;place-items:center;background:var(--bg-2);color:var(--text-3);font-size:13.5px;text-align:center;padding:0 16px}

.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;margin-top:10px}
.ph{position:relative;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--line-soft);background:var(--bg-2)}
.ph.cover{border-color:var(--rose);border-width:2px}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}
.ph-cv{position:absolute;top:5px;inset-inline-end:5px;background:var(--rose);color:#fff;
  font-size:10px;padding:2px 6px;border-radius:var(--r-pill);font-weight:700}
.ph-bar{display:flex;border-top:1px solid var(--line-soft)}
.ph-bar button{flex:1;padding:6px;font-size:11.5px;color:var(--text-2)}
.ph-bar button+button{border-inline-start:1px solid var(--line-soft)}
.ph-bar select{width:100%;border:none;font-size:11.5px;padding:6px 4px;background:var(--bg);text-align:center}
.up{border:1px dashed var(--line);border-radius:var(--r-s);aspect-ratio:4/3;display:grid;place-items:center;
  position:relative;text-align:center;color:var(--text-2);font-size:12.5px;padding:8px;cursor:pointer}
.up:hover{border-color:var(--text)}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.up em{font-style:normal;font-size:22px;display:block;opacity:.5;margin-bottom:3px}
.upq{font-size:12.5px;color:var(--text-2);margin-top:8px;min-height:18px}

.acts{display:flex;gap:10px;flex-wrap:wrap}
.btn{flex:1;min-width:112px;padding:13px 16px;border-radius:var(--r-s);font-weight:700;font-size:15px;
  text-align:center;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.15s}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn-d{background:var(--text);color:#fff}
.btn-o{background:var(--bg);color:var(--text);border:1px solid var(--text)}
.btn-q{background:var(--bg);color:var(--text-2);border:1px solid var(--line)}
.btn-x{background:var(--bg);color:var(--red);border:1px solid #F0BDB0}
.btn-w{width:100%;flex:none}
.btn-s{padding:9px 14px;font-size:13.5px;min-width:auto;flex:none}

.savebar{position:sticky;bottom:0;z-index:30;background:var(--bg);border-top:1px solid var(--line);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));margin:0 -16px;display:flex;gap:10px;align-items:center}
.savebar .meter{flex:1;min-width:0}
.savebar .meter b{display:block;font-size:12.5px;font-weight:500}
.unsaved{flex:none;padding:6px 11px;border-radius:var(--r-pill);background:#FFF0F3;
  color:var(--rose-d);font-size:11.5px;font-weight:700;white-space:nowrap;
  border:1px solid var(--rose);animation:pulseU 1.6s ease-in-out infinite}
@keyframes pulseU{0%,100%{opacity:1}50%{opacity:.55}}
.savebar .meter i{display:block;height:4px;background:var(--line-soft);border-radius:var(--r-pill);margin-top:5px;overflow:hidden}
.savebar .meter i u{display:block;height:100%;width:0;transition:width .3s}

.item{display:flex;gap:11px;align-items:center;padding:10px;border:1px solid var(--line-soft);
  border-radius:var(--r-m);margin-bottom:9px;text-align:start;width:100%;background:var(--bg)}
.item:hover{box-shadow:var(--sh)}
.item img{width:54px;height:54px;border-radius:var(--r-s);object-fit:cover;background:var(--bg-2);flex:none}
.item .nop{width:54px;height:54px;border-radius:var(--r-s);background:var(--bg-2);display:grid;place-items:center;opacity:.4;flex:none}
.item div{flex:1;min-width:0}
.item b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item span{display:block;font-size:12.5px;color:var(--text-2)}

.sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 12px;gap:12px}

.msg.ok{background:#E9F5EA;color:var(--green)}
.msg.wait{background:#FFF4E5;color:var(--amber)}
.msg.info{background:#EDF3FA;color:var(--blue)}
.fine{font-size:12.5px;color:var(--text-3);line-height:1.75}

.nav{position:fixed;bottom:0;inset-inline:0;z-index:50;background:var(--bg);border-top:1px solid var(--line-soft);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:flex;max-width:900px;margin:0 auto}
.nav button{flex:1;height:var(--nav);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--text-3);font-size:10.5px}
.nav button.on{color:var(--text);font-weight:700}
.nav button i{font-style:normal;font-size:19px}

.toast{position:fixed;bottom:88px;inset-inline:16px;z-index:99;background:var(--text);color:#fff;
  padding:13px 16px;border-radius:var(--r-s);font-weight:500;font-size:14px;text-align:center;box-shadow:var(--sh-up)}
.toast.no{background:var(--red)}
.toast.ok{background:#0B6B14}

.sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:520px;border-radius:var(--r-l) var(--r-l) 0 0;
  padding:20px 16px calc(24px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto}
.sheet-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.sheet-hd h3{font-size:19px}
.pick4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pick4 button{padding:18px 10px;border-radius:var(--r-m);border:1px solid var(--line);background:var(--bg);text-align:center}
.pick4 button:hover{border-color:var(--text)}
.pick4 i{font-style:normal;font-size:25px;display:block;margin-bottom:6px}
.pick4 span{font-size:13.5px;font-weight:500}

.auth{min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:28px 20px}
.auth-in{width:100%;max-width:380px;margin:0 auto}
.auth-mark{text-align:center;margin-bottom:24px}

.btn-o .sp,.btn-q .sp{border-color:var(--line-soft);border-top-color:var(--text)}
@keyframes s{to{transform:rotate(360deg)}}

/** يوزّع حقول القطاع على مجموعاته، وما لم يُذكر يذهب لـ«تفاصيل أخرى» */
function groupFields(defs, groups){
  const used = {}, out = [];
  (groups||[]).forEach(function(g){
    const fs = g.k.map(function(k){ return defs.find(function(f){ return f.k === k; }); })
                  .filter(Boolean);
    fs.forEach(function(f){ used[f.k] = 1; });
    if(fs.length) out.push({t:g.t, i:g.i, fs:fs});
  });
  const rest = defs.filter(function(f){ return !used[f.k]; });
  if(rest.length) out.push({t:"تفاصيل أخرى", i:"➕", fs:rest});
  return out;
}

  catch(e){
    /* Apps Script يعيد صفحة HTML عند انتهاء المهلة أو نفاد الحصة أو خطأ نشر.
       نُظهر أول سطر منها بدل رسالة "JSON غير صالح" المبهمة. */
    const plain = txt.replace(/<[^>]*>/g," ").replace(/\s+/g," ").trim();
    throw new Error(res.status === 200
      ? ("ردّ غير متوقّع من الخادم: " + plain.substring(0,80))
      : ("الخادم أعاد الرمز " + res.status + " — راجع النشر"));
  }
  if(d && d.reason === "session"){ lock(true); throw new Error("انتهت الجلسة"); }
  return d;
}

/* ═══════════════════════════════════════════════════════════════════════
   الدخول
═══════════════════════════════════════════════════════════════════════ */
$("#btnIn").onclick = doLogin;
$("#pw").addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });

function authMsg(t, k){
  const el = $("#authMsg");
  el.className = "msg " + (k || "no");
  el.textContent = t;
  el.classList.remove("hidden");
}

async function doLogin(){
  const p = $("#pw").value.trim();
  $("#authMsg").classList.add("hidden");
  if(!p) return authMsg("اكتب كلمة المرور.");
  const b = $("#btnIn");
  b.innerHTML = '<span class="sp"></span>'; b.disabled = true;
  try{
    const res = await fetch(API, {
      method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify({action:"opLogin", pass:p})
    });
    const r = await res.json();
    if(!r || !r.success) return authMsg((r && r.msg) || "كلمة المرور غير صحيحة.");
    S.session = r.session;
    sessionStorage.setItem("hut_op", r.session);
    start();
  }catch(e){ authMsg("تعذّر الوصول للخادم."); }
  finally{ b.textContent = "دخول"; b.disabled = false; }
}

(function resume(){
  const s = sessionStorage.getItem("hut_op");
  if(s){ S.session = s; start(); }
})();

async function start(){
  $("#auth").classList.add("hidden");
  $("#app").classList.remove("hidden");
  paintSectorChips();
  await load();
}

function lock(expired){
  sessionStorage.removeItem("hut_op");
  S.session = ""; S.dirty = false;
  $("#app").classList.add("hidden");
  $("#auth").classList.remove("hidden");
  $("#pw").value = "";
  if(expired) authMsg("انتهت الجلسة — أدخل كلمة المرور من جديد.", "wait");
}

$("#btnOut").onclick = () => { if(confirm("قفل اللوحة؟")) lock(); };

/* ═══════════════════════════════════════════════════════════════════════
   القائمة

function paintSectorChips(){
  $("#secChips").innerHTML =
    `<button class="chip on" data-s="all">الكل <span class="n" id="c_all">0</span></button>` +
    Object.keys(SCHEMA).map(k =>
      `<button class="chip" data-s="${k}">${SCHEMA[k].icon} ${SCHEMA[k].label} <span class="n" id="c_${k}">0</span></button>`).join("");
  $$("#secChips .chip").forEach(b => b.onclick = () => {
    $$("#secChips .chip").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); S.sector = b.dataset.s; renderStats(); renderList();
  });
}

$$("#stChips .chip").forEach(b => b.onclick = () => {
  $$("#stChips .chip").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); S.filter = b.dataset.f; renderStats(); renderList();
});

let qT = null;
$("#q").oninput = e => { clearTimeout(qT); qT = setTimeout(() => { S.q = e.target.value.trim(); renderList(); }, 220); };
$("#btnSync").onclick = () => { load(); toast("يُحدَّث…"); };

async function load(){
  if(S.busy) return;
  S.busy = true;
  try{
    const d = await api("opList", {});
    if(!d || !d.success) throw new Error((d && d.msg) || "تعذّر التحميل");
    S.partners = d.partners || [];
    setLive(true);
    renderCounts();
    renderStats();
    renderList();
  }catch(e){
    setLive(false);
    $("#list").innerHTML = `<div class="msg no">${esc(e.message)}</div>`;
  }finally{ S.busy = false; }
}

function setLive(on){
  const d = $("#live"), t = $("#liveTxt");
  if(d) d.className = "dot " + (on ? "" : "off");
  if(t) t.textContent = on ? "متصل" : "غير متصل";
}

function renderCounts(){
  const el = $("#c_all"); if(el) el.textContent = S.partners.length;
  Object.keys(SCHEMA).forEach(k => {
    const e2 = $("#c_" + k);
    if(e2) e2.textContent = S.partners.filter(p => p.sector === k).length;
  });
}

/* شريط الحصيلة: الموظف يرى عبء عمله قبل أن يمرّر سطراً واحداً */
function renderStats(){
  const all = S.partners;
  const inSector = S.sector === "all" ? all : all.filter(p => p.sector === S.sector);
  const cards = [
    {f:"all",     n:inSector.length,                                              l:"الكل"},
    {f:"pending", n:inSector.filter(p=>p.status==="pending").length,              l:"قيد المراجعة"},
    {f:"noitems", n:inSector.filter(p=>!Number(p.items||0)).length,               l:"بلا عناصر"},
    {f:"weak",    n:inSector.filter(p=>Number(p.completeness||0)<70).length,      l:"ناقص"}
  ];
  $("#stats").innerHTML = cards.map(c=>`
    <button class="${S.filter===c.f?"on":""}" onclick="pickFilter('${c.f}')">
      <b style="${c.f!=="all"&&c.n?"color:var(--rose)":""}">${c.n}</b><span>${c.l}</span>
    </button>`).join("");
}

window.pickFilter = function(f){
  S.filter = f;
  $$("#stChips .chip").forEach(x => x.classList.toggle("on", x.dataset.f === f));
  renderStats();
  renderList();
};

function renderList(){
  const q = S.q.toLowerCase();
  const list = S.partners.filter(p => {
    if(S.sector !== "all" && p.sector !== S.sector) return false;
    if(S.filter === "noitems"){ if(Number(p.items||0) > 0) return false; }
    else if(S.filter === "weak"){ if(Number(p.completeness||0) >= 70) return false; }
    else if(S.filter !== "all" && p.status !== S.filter) return false;
    if(!q) return true;
    return [p.name, p.phone, p.city, p.area, p.id].join(" ").toLowerCase().includes(q);
  });

  const box = $("#list");
  if(!list.length){
    box.innerHTML = `<div class="void"><span class="i">🗂️</span><b>لا نتائج</b>
      <p>${S.q ? "جرّب كلمة بحث أخرى." : "ابدأ بإضافة أول شريك من زر الإضافة بالأسفل."}</p></div>`;
    return;
  }

  box.innerHTML = list.map(p => {
    const sk = SK(p.sector);
    const pc = Number(p.completeness || 0);
    const col = pctColor(pc), circ = 2*Math.PI*18;
    const st = {pending:["wait","قيد المراجعة"], active:["ok","مفعّل"], blocked:["no","موقوف"]}[p.status] || ["","—"];
    const items = Number(p.items||0);
    return `<button class="row" data-st="${esc(p.status)}" onclick="openPartner('${esc(p.id)}')">
      ${p.cover
        ? `<img class="row-img" src="${esc(p.cover)}" alt="" loading="lazy">`
        : `<div class="row-ph" style="background:${col}12;color:${col}">${sk.icon}</div>`}
      <div class="row-mid">
        <b>${esc(p.name)}</b>
        <div class="rmeta">
          <span>${sk.icon} ${esc(sk.label)}</span>
          <span>${esc(p.city||"—")}${p.area ? " · " + esc(p.area) : ""}</span>
        </div>
        <div class="rmeta">
          <span class="num">${esc(p.phone||"بلا هاتف")}</span>
          <span class="${items?"":"warn"}">${items ? items + " " + esc(sk.itemOne) : "بلا " + esc(sk.itemOne)}</span>
          <span class="state ${st[0]}">${st[1]}</span>
        </div>
      </div>
      <div class="ring2" style="color:${col}">
        <svg viewBox="0 0 42 42"><circle cx="21" cy="21" r="18" stroke="var(--line-soft)"></circle>
        <circle cx="21" cy="21" r="18" stroke="${col}" stroke-linecap="round"
          stroke-dasharray="${circ}" stroke-dashoffset="${circ*(1-pc/100)}"></circle></svg>
        <b>${pc}</b>
      </div>
    </button>
    ${items === 0 ? `<button class="quick" onclick="quickAdd('${esc(p.id)}',event)">
        <span>＋</span> أضف ${esc(sk.itemOne)} لـ«${esc(p.name)}»</button>` : ""}`;
  }).join("");
}

/* ═══════════════════════════════════════════════════════════════════════
   راسم الحقول — كل الواجهة تُبنى من SCHEMA
═══════════════════════════════════════════════════════════════════════ */
function fieldHTML(f, val, pre){
  const id = pre + f.k;
  const lbl = `<label for="${id}">${esc(f.l)}${f.req ? ' <span class="rq">*</span>' : ""}${
    f.hint ? ` <span class="hint">— ${esc(f.hint)}</span>` : ""}</label>`;
  const v = (val === undefined || val === null) ? "" : val;

  if(f.t === "bool"){
    const on = v === true || v === "true" || v === 1 || v === "1";
    return `<div class="fld ${f.w?"w":""}">
      <button type="button" class="sw ${on?"on":""}" id="${id}" data-v="${on?1:0}"
        onclick="tglSw(this)"><span>${esc(f.l)}</span><i></i></button></div>`;
  }

  if(f.t === "multi"){
    const cur = Array.isArray(v) ? v : (v ? String(v).split(",").map(x=>x.trim()) : []);
    return `<div class="fld ${f.w?"w":""}">${lbl}
      <div class="pills" id="${id}">${(f.opts||[]).map(o =>
        `<button type="button" class="pill ${cur.includes(o)?"on":""}" data-o="${esc(o)}"
          onclick="this.classList.toggle('on');scoreNow()">${esc(o)}</button>`).join("")}</div></div>`;
  }

  if(f.t === "select"){
    const L = f.labels || {};
    return `<div class="fld ${f.w?"w":""}">${lbl}
      <select id="${id}"><option value="">— اختر —</option>${(f.opts||[]).map(o =>
        `<option value="${esc(o)}" ${String(v)===String(o)?"selected":""}>${esc(L[o]||o)}</option>`).join("")}</select></div>`;
  }

  if(f.t === "area")
    return `<div class="fld w">${lbl}<textarea id="${id}" rows="3">${esc(v)}</textarea></div>`;

  const type = (f.t === "num" || f.t === "money") ? "number" : f.t === "time" ? "time" : f.t === "tel" ? "tel" : "text";
  const cls  = f.t === "tel" ? "tel-in" : "";
  const im   = (f.t === "num" || f.t === "money" || f.t === "tel") ? 'inputmode="numeric"' : "";
  const unit = f.t === "money" ? "د.ع" : (f.u || "");
  const inp  = `<input id="${id}" type="${type}" class="${cls}" ${im} value="${esc(v)}">`;
  return `<div class="fld ${f.w?"w":""}">${lbl}${
    unit ? `<div class="unit"><span>${esc(unit)}</span>${inp}</div>` : inp}</div>`;
}

function tglSw(b){
  const on = b.dataset.v === "1";
  b.dataset.v = on ? "0" : "1";
  b.classList.toggle("on", !on);
  S.dirty = true;
  scoreNow();
}

function readField(f, pre){
  const el = document.getElementById(pre + f.k);
  if(!el) return "";
  if(f.t === "bool")  return el.dataset.v === "1";
  if(f.t === "multi") return [...el.querySelectorAll(".pill.on")].map(x => x.dataset.o);
  const v = String(el.value || "").trim();
  if(f.t === "num" || f.t === "money") return v === "" ? "" : Number(v);
  return v;
}

function group(id, title, inner, open, note){
  return `<div class="grp ${open?"open":""}" id="g_${id}">
    <button type="button" class="grp-hd" onclick="this.parentNode.classList.toggle('open')">
      <b>${esc(title)}</b>${note !== undefined ? `<span class="cnt" id="gc_${id}">${esc(note)}</span>` : ""}
      <span class="arw">⌄</span></button>
    <div class="grp-bd">${inner}</div></div>`;
}

function newPartner(sector){

           comm_type:"fixed", features:[], specs:{}, media:[]};
  S.curItems = [];
  S.media = [];

/* الطريق السريع: من قائمة الشركاء إلى إضافة عنصر بضغطة واحدة،
   بدل فتح الشريك ثم التمرير ثم فتح العناصر ثم الإضافة. */
window.quickAdd = async function(pid, ev){
  if(ev) ev.stopPropagation();
  toast("يُفتح…");
  try{
    const d = await api("opGet", {id:pid});
    if(!d || !d.success) return toast((d && d.msg) || "تعذّر التحميل", true);
    const p = d.partner;
    p.features = Array.isArray(p.features) ? p.features : [];
    p.specs = p.specs || {};
    S.cur = p;
    S.curItems = d.offerings || [];
    S.media = Array.isArray(p.media) ? p.media.slice() : [];
    S.dirty = false;
    openItem(-1);
  }catch(e){ toast(e.message, true); }
};

async function openPartner(id){
  toast("يُحمَّل…");
  try{
    const d = await api("opGet", {id:id});
    if(!d || !d.success) return toast((d && d.msg) || "تعذّر التحميل", true);
    const p = d.partner || {};
    p.features = Array.isArray(p.features) ? p.features : [];
    p.specs = p.specs || {};
    S.cur = p;
    S.curItems = d.offerings || [];
    S.media = Array.isArray(p.media) ? p.media.slice() : [];
    S.dirty = false;
    S.tab = 0;
    renderEdit(false);
    go("vEdit");
  }catch(e){ toast("تعذّر التحميل", true); }
}

/* ═══════════════════════════════════════════════════════════════════════
   محرّر الشريك — أقسام مستقلة بدل شريط واحد طويل
   الموظف يرى قسماً واحداً، ويعرف من الملاحة أين هو وما ينقصه.
═══════════════════════════════════════════════════════════════════════ */

/** تعريف الأقسام: العنوان، الشرح، الحقول، وكيف يُقاس اكتمالها */
function editSections(p, isNew){
  const sk = SK(p.sector);
  return [
    {id:"base", t:"الأساسيات", a:"rose", d:"ما يراه الزبون أولاً: الاسم والمدينة ورقم التواصل.",
     req:BASE.filter(f=>f.req).map(f=>({k:f.k, pre:"f_", l:f.l}))},
    {id:"loc", t:"الموقع", a:"blue", d:"العنوان والإحداثيات — الزبون يسأل «وين؟» قبل السعر.",
     req:LOCF.filter(f=>f.req).map(f=>({k:f.k, pre:"f_", l:f.l}))},
    {id:"spec", t:"المواصفات", a:"violet", d:"تفاصيل " + sk.label + " التي تظهر في صفحة التفاصيل.",
     req:sk.specs.filter(f=>f.req).map(f=>({k:f.k, pre:"s_", l:f.l}))},
    {id:"feat", t:"المميزات", a:"green", d:"اختر ما يوفّره فعلاً — تظهر بأيقونات عند الزبون.", req:[], soft:"features"},
    {id:"media", t:"الصور", a:"amber", d:"ثلاث صور فأكثر ترفع الحجز كثيراً. أول صورة هي الغلاف.", req:[], soft:"media"},
    {id:"adm", t:"الإدارة", a:"slate", d:"الحالة والعمولة وملاحظاتك الداخلية.",
     req:[{k:"status", pre:"f_", l:"حالة الحساب"}]},
    {id:"items", t:sk.itemMany, a:"rose", d:"لكل " + sk.itemOne + " صوره ومواصفاته وسعره.", req:[], locked:isNew}
  ];
}

/** كم حقلاً إلزامياً ما زال فارغاً في هذا القسم؟ */
function sectionMissing(sec){
  let n = 0;
  (sec.req||[]).forEach(function(r){
    const el = document.getElementById(r.pre + r.k);
    if(!el) return;
    let v;
    if(el.dataset && el.dataset.v !== undefined) v = el.dataset.v === "1";
    else if(el.classList && el.classList.contains("pills")) v = el.querySelectorAll(".pill.on").length > 0;
    else v = String(el.value || "").trim();
    if(!v || v === "") n++;
  });
  if(sec.soft === "media" && !S.media.length) n = 0;
  return n;
}

function paintTabs(){
  const secs = S.secs || [];
  const bar = $("#eTabs");
  if(!bar) return;
  bar.innerHTML = secs.map(function(sec, i){
    const miss = sec.locked ? 0 : sectionMissing(sec);
    const soft = sec.soft === "media" ? S.media.length
               : sec.soft === "features" ? ($("#f_features") ? $("#f_features").querySelectorAll(".pill.on").length : 0)
               : -1;
    let dot = "";
    if(sec.locked) dot = "";
    else if(miss) dot = `<span class="dot miss"></span>`;
    else if(soft === 0) dot = "";
    else dot = `<span class="dot done"></span>`;
    return `<button class="tab ${i===S.tab?"on":""}" onclick="goTab(${i})">${dot}${esc(sec.t)}${
      miss?` <span style="font-family:var(--num);font-size:11px">${miss}</span>`:""}</button>`;
  }).join("");
}

window.goTab = function(i){
  S.tab = i;
  $$(".pane").forEach(function(el, j){ el.classList.toggle("on", j === i); });
  paintTabs();
  const nav = $("#eNav");
  if(nav){
    const secs = S.secs || [];
    nav.innerHTML =
      `<button onclick="goTab(${Math.max(0,i-1)})" ${i===0?"disabled":""}>السابق</button>` +
      (i < secs.length-1
        ? `<button class="next" onclick="goTab(${i+1})">التالي · ${esc(secs[i+1].t)}</button>`
        : `<button class="next" onclick="document.getElementById('btnSave').click()">حفظ الملف</button>`);
  }
  if(i === 1) drawMap();
  window.scrollTo({top:0, behavior:"smooth"});
};

function ringHTML(pc){
  const col = pctColor(pc), r = 19, c = 2*Math.PI*r;
  return `<div class="ering" style="color:${col}">
    <svg viewBox="0 0 44 44"><circle cx="22" cy="22" r="${r}" stroke="var(--line-soft)"></circle>
    <circle cx="22" cy="22" r="${r}" stroke="${col}" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pc/100)}"></circle></svg>
    <span id="eRingTxt">${pc}</span></div>`;
}

function renderEdit(isNew){
  const p = S.cur, sk = SK(p.sector);
  $("#mark").textContent = sk.icon;
  S.secs = editSections(p, isNew);
  if(S.tab === undefined || S.tab >= S.secs.length) S.tab = 0;

  const secSel = isNew
    ? `<div class="fld w"><label>نوع النشاط <span class="rq">*</span></label>
        <select id="f_sector" onchange="switchSector(this.value)">${Object.keys(SCHEMA).map(k =>
          `<option value="${k}" ${k===p.sector?"selected":""}>${SCHEMA[k].icon} ${SCHEMA[k].label}</option>`).join("")}</select></div>`
    : "";

  /* بطاقة فرعية معنونة — بدل كدس كل الحقول في صندوق واحد */
  const card = function(icon, title, inner, count){
    return `<div class="sub">
      <div class="sub-h"><span class="sub-i">${icon}</span><b>${esc(title)}</b>
        ${count!==undefined?`<span class="n">${count}</span>`:""}</div>
      <div class="sub-b">${inner}</div></div>`;
  };
  const cardsFor = function(defs, groups, pre, vals){
    return groupFields(defs, groups).map(function(g){
      return card(g.i, g.t, `<div class="fg">${g.fs.map(function(f){
        return fieldHTML(f, (vals||{})[f.k], pre); }).join("")}</div>`);
    }).join("");
  };
  const pane = function(i, inner){
    const sec = S.secs[i];
    return `<div class="pane ${i===S.tab?"on":""}" data-a="${sec.a||"slate"}">
      <div class="pane-h"><h3>${esc(sec.t)}</h3><p>${esc(sec.d)}</p></div>
      ${inner}</div>`;
  };

  $("#form").innerHTML = `
    <div class="ehead"><div class="ehead-in">
      ${ringHTML(0)}
      <div class="ehead-t"><b id="eName">${esc(p.id ? p.name : "شريك جديد")}</b>
        <span>${esc(sk.label)}${p.id ? " · " + esc(p.id) : ""}</span></div>
    </div></div>

    <div class="ework">
      <div class="tabs" id="eTabs"></div>
      <div class="ework-main">

      ${pane(0,
        (isNew ? card("🏷️","نوع النشاط",`<div class="fg">${secSel}</div>`) : "") +
        card("📛","التعريف", `<div class="fg">${["name"].map(k=>fieldHTML(BASE.find(f=>f.k===k), p[k], "f_")).join("")}</div>`) +
        card("📍","المحافظة والمنطقة", `<div class="fg">${["city","area"].map(k=>fieldHTML(BASE.find(f=>f.k===k), p[k], "f_")).join("")}</div>`) +

/* ── الخريطة: OpenStreetMap، بلا مفتاح وبلا تكلفة ── */
function parseMaps(url){
  const s = String(url||"");
  const m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)
        || s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)
        || s.match(/[?&]q=(-?\d+\.\d+),(-?\d+\.\d+)/)
        || s.match(/(-?\d{1,2}\.\d{4,})\s*,\s*(-?\d{1,3}\.\d{4,})/);
  if(m){
    $("#f_lat").value = m[1];
    $("#f_lng").value = m[2];
    drawMap();
    toast("استُخرجت الإحداثيات", false, "ok");
  }
}

function drawMap(){
  const box = $("#mapBox");
  if(!box) return;
  const la = parseFloat(($("#f_lat")||{}).value), ln = parseFloat(($("#f_lng")||{}).value);
  if(isNaN(la) || isNaN(ln) || !la || !ln){
    box.innerHTML = `<div class="map"><div class="map-empty">لا يوجد موقع بعد — التقط موقعك أو الصق رابط خرائط جوجل</div></div>`;
    return;
  }
  const d = 0.004;
  const bbox = [ln-d, la-d, ln+d, la+d].join(",");
  box.innerHTML = `<div class="map"><iframe loading="lazy" title="موقع الشريك"
    src="https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${la},${ln}"></iframe></div>`;
}

function geoNow(){
  if(!navigator.geolocation) return toast("جهازك لا يدعم تحديد الموقع", true);
  toast("يُحدَّد الموقع…");
  navigator.geolocation.getCurrentPosition(
    p => { $("#f_lat").value = p.coords.latitude.toFixed(6);
           $("#f_lng").value = p.coords.longitude.toFixed(6);
           drawMap(); S.dirty = true; scoreNow();
           toast("التُقط الموقع", false, "ok"); },
    () => toast("تعذّر تحديد الموقع — اسمح بالإذن ثم أعد المحاولة", true),
    {enableHighAccuracy:true, timeout:12000});
}

function openMaps(){
  const la = ($("#f_lat")||{}).value, ln = ($("#f_lng")||{}).value;
  window.open(la && ln ? `https://www.google.com/maps?q=${la},${ln}` : "https://www.google.com/maps", "_blank");
}

/* ═══════════════════════════════════════════════════════════════════════
   المعرض — رفع متعدد إلى ImgBB عبر الخادم
═══════════════════════════════════════════════════════════════════════ */
function mediaOf(scope){ return scope === "pm" ? S.media : S.itemMedia; }
function kindsOf(scope){ return scope === "pm" ? SK(S.cur.sector).mediaKinds : SK(S.cur.sector).item.mediaKinds; }

function galleryHTML(scope){
  return `<p class="fine" style="margin:0">أول صورة هي الغلاف. صنّف كل صورة ليعرف الزبون ما يرى.</p>
    <div class="gal" id="gal_${scope}"></div>
    <div class="upq" id="upq_${scope}"></div>`;
}

function paintGallery(scope){
  const arr = mediaOf(scope), kinds = kindsOf(scope);
  const box = $("#gal_" + scope);
  if(!box) return;
  box.innerHTML = arr.map((m, i) => `
    <div class="ph ${i===0?"cover":""}">
      <img src="${esc(m.thumb || m.url)}" alt="" loading="lazy">
      ${i===0 ? `<span class="ph-cv">الغلاف</span>` : ""}
      <div class="ph-bar">
        <select onchange="setKind('${scope}',${i},this.value)">
          ${kinds.map(k => `<option ${m.kind===k?"selected":""}>${esc(k)}</option>`).join("")}
        </select>
      </div>
      <div class="ph-bar">
        ${i>0 ? `<button type="button" onclick="makeCover('${scope}',${i})">غلاف</button>` : ""}
        <button type="button" onclick="rmPhoto('${scope}',${i})" style="color:var(--red)">حذف</button>
      </div>
    </div>`).join("") +
    `<label class="up"><em>📷</em>أضف صوراً
      <span style="display:block;font-size:11px;opacity:.7">يمكن اختيار عدة صور معاً</span>
      <input type="file" accept="image/*" multiple onchange="pickFiles('${scope}', this)"></label>`;
  const g = $("#gc_media");
  if(scope === "pm" && g) g.textContent = arr.length + " صورة";
}

function pickFiles(scope, inp){
  const files = [...inp.files];
  inp.value = "";
  queueUpload(scope, files);
}

async function queueUpload(scope, files){
  if(!files.length) return;
  const arr = mediaOf(scope), kinds = kindsOf(scope);
  const q = $("#upq_" + scope);
  let done = 0, failed = 0;
  S.uploading += files.length;

  for(let i = 0; i < files.length; i++){
    const f = files[i];
    if(q) q.textContent = "يُرفع " + (i+1) + " من " + files.length + "…";
    let ok = false, lastErr = "";

    /* محاولتان: أغلب حالات الفشل عابرة (مهلة أو شبكة) */
    for(let attempt = 0; attempt < 2 && !ok; attempt++){
      try{
        const blob = await shrink(f);
        if(blob.size > 3500000) throw new Error("الصورة كبيرة جداً حتى بعد الضغط");
        const b64 = await toBase64(blob);
        const r = await api("opUpload", {image:b64, name:"hut_" + Date.now()});
        if(!r || !r.success) throw new Error((r && r.msg) || "رفض الخادم الصورة");
        arr.push({url:r.url, thumb:r.thumb || r.url, del:r.del || "", kind:kinds[0]});
        ok = true; done++; S.dirty = true;
        paintGallery(scope);
      }catch(err){
        lastErr = err.message;
        if(attempt === 0){ if(q) q.textContent = "تعذّرت " + (i+1) + " — إعادة المحاولة…"; await new Promise(r2=>setTimeout(r2,900)); }
      }
    }
    if(!ok){ failed++; toast("فشلت صورة: " + lastErr, true); }
  }

  S.uploading -= files.length;
  if(q){
    q.textContent = failed ? (done + " نجحت · " + failed + " فشلت") : (done + " صورة جاهزة");
    setTimeout(()=>{ if(q) q.textContent = ""; }, 4000);
  }
  scoreNow();
  markUnsaved();

  /* ★ حفظ تلقائي: أكثر ما يضيّع العمل أن ترفع الصور ثم تغادر بلا حفظ.
     إن كان السجل محفوظاً مسبقاً (له معرّف) نثبّت الصور فوراً بلا انتظار ضغطة. */
  if(done && !failed) autoSaveMedia(scope);
}

/** يحفظ الصور وحدها فور رفعها — بلا لمس بقية الحقول التي يكتبها الموظف */
async function autoSaveMedia(scope){
  try{
    if(scope === "pm"){
      if(!S.cur || !S.cur.id) return;          // شريك جديد: ينتظر الحفظ الأول
      const snap = collectInto(Object.assign({}, S.cur));
      const r = await api("opSavePartner", {partner:snap});
      if(r && r.success){
        S.cur = snap;
        toast("حُفظت الصور تلقائياً", false, "ok");
        markUnsaved();
        load();
      }
    }else{
      if(!S.curItem || !S.curItem.id) return;  // عنصر جديد: ينتظر الحفظ الأول
      const it = Object.assign({}, S.curItem);
      it.media = S.itemMedia;
      it.partner_id = S.cur.id;
      it.sector = S.cur.sector;
      delete it._idx;
      const r = await api("opSaveOffering", {offering:it});
      if(r && r.success){
        S.curItem.media = S.itemMedia;
        toast("حُفظت الصور تلقائياً", false, "ok");
        markUnsaved();
        load();
      }
    }
  }catch(e){ /* الحفظ اليدوي يبقى متاحاً */ }
}

/** يُظهر كم صورة ما زالت في المتصفح ولم تصل الشيت */
function markUnsaved(){
  const setBadge = function(id, n){
    const el = $(id);
    if(!el) return;
    el.textContent = n + (n === 1 ? " صورة غير محفوظة" : " صور غير محفوظة");
    el.classList.toggle("hidden", n < 1);
  };
  if(S.view === "vEdit"){
    const saved = (S.cur && Array.isArray(S.cur.media)) ? S.cur.media.length : 0;
    setBadge("#pmUnsaved", Math.max(0, S.media.length - saved));
  }
  if(S.view === "vItem"){
    const saved = (S.curItem && Array.isArray(S.curItem.media)) ? S.curItem.media.length : 0;
    setBadge("#imUnsaved", Math.max(0, S.itemMedia.length - saved));
  }
}

function setKind(scope, i, v){ mediaOf(scope)[i].kind = v; S.dirty = true; }

function makeCover(scope, i){
  const arr = mediaOf(scope);
  const [m] = arr.splice(i, 1);
  arr.unshift(m);
  S.dirty = true;
  paintGallery(scope);
  markUnsaved();
}

function rmPhoto(scope, i){
  if(!confirm("حذف هذه الصورة؟")) return;
  mediaOf(scope).splice(i, 1);
  S.dirty = true;
  paintGallery(scope);
  scoreNow();
  markUnsaved();
}

function toBase64(blob){
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload  = () => { const s = String(r.result); res(s.substring(s.indexOf(",") + 1)); };
    r.onerror = () => rej(new Error("تعذّرت قراءة الملف"));
    r.readAsDataURL(blob);
  });
}

function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const k = Math.min(1, IMG.MAX / Math.max(img.width, img.height));
      const cv = document.createElement("canvas");
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
      cv.toBlob(b => b ? res(b) : rej(new Error("فشل ضغط الصورة")), "image/jpeg", IMG.Q);
    };
    img.onerror = () => rej(new Error("ملف صورة غير صالح"));
    img.src = url;
  });
}

/* ═══════════════════════════════════════════════════════════════════════
   مقياس الاكتمال — يدفع الموظف لملء ما ينفع الزبون
   الإلزامي بوزن ٣، وما يظهر للزبون بوزن ٢، والداخلي بوزن ١.
═══════════════════════════════════════════════════════════════════════ */
function score(blocks, mediaArr, featEl){
  let got = 0, need = 0;
  blocks.forEach(({defs, pre}) => defs.forEach(f => {
    const w = f.req ? 3 : (f.pub ? 2 : 1);
    need += w;
    const v = readField(f, pre);
    const filled = Array.isArray(v) ? v.length > 0
                 : (v === true || (v !== "" && v !== false && v !== null && v !== undefined));
    if(filled) got += w;
  }));
  need += 6;
  got += mediaArr.length >= 3 ? 6 : mediaArr.length * 2;
  if(featEl){ need += 3; got += Math.min(3, featEl.querySelectorAll(".pill.on").length); }
  return Math.max(0, Math.min(100, Math.round(got / need * 100)));
}

function scoreNow(){
  if(S.view === "vEdit" && $("#form").children.length){
    const sk = SK(S.cur.sector);
    const pc = score([{defs:BASE, pre:"f_"}, {defs:LOCF, pre:"f_"}, {defs:sk.specs, pre:"s_"}],
                     S.media, $("#f_features"));
    $("#mTxt").textContent = "اكتمال الملف " + pc + "٪";
    $("#mBar").style.width = pc + "%";
    $("#mBar").style.background = pctColor(pc);
    const ring = document.querySelector(".ering");
    if(ring){
      const circles = ring.querySelectorAll("circle");
      const c = 2*Math.PI*19;
      ring.style.color = pctColor(pc);
      if(circles[1]){ circles[1].setAttribute("stroke", pctColor(pc));
                      circles[1].setAttribute("stroke-dashoffset", c*(1-pc/100)); }
      const t = $("#eRingTxt"); if(t) t.textContent = pc;
    }
  }
  if(S.view === "vItem" && $("#itemForm").children.length){
    const sk = SK(S.cur.sector).item;
    const base = ITEM_BASE.map(f => f.k === "type" ? Object.assign({}, f, {opts:sk.types}) : f);
    const pc = score([{defs:base, pre:"i_"}, {defs:sk.specs, pre:"is_"}],
                     S.itemMedia, $("#i_features"));
    $("#iTxt").textContent = "اكتمال العنصر " + pc + "٪";
    $("#iBar").style.width = pc + "%";
    $("#iBar").style.background = pctColor(pc);
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   حفظ الشريك
═══════════════════════════════════════════════════════════════════════ */
function collectInto(p){
  const sk = SK(p.sector);
  BASE.forEach(f => p[f.k] = readField(f, "f_"));
  LOCF.forEach(f => p[f.k] = readField(f, "f_"));
  ADMINF.forEach(f => { if(document.getElementById("f_" + f.k)) p[f.k] = readField(f, "f_"); });
  const fe = $("#f_features");
  if(fe) p.features = [...fe.querySelectorAll(".pill.on")].map(x => x.dataset.o);
  p.specs = {};
  sk.specs.forEach(f => p.specs[f.k] = readField(f, "s_"));
  p.media = S.media;
  return p;
}

$("#btnSave").onclick = async () => {
  if(S.uploading > 0) return toast("انتظر انتهاء رفع الصور", true);
  const p = collectInto(Object.assign({}, S.cur));

  const missing = BASE.concat(LOCF).filter(f => f.req).filter(f => {
    const v = p[f.k]; return !v || (Array.isArray(v) && !v.length);
  }).map(f => f.l);
  if(!p.status) missing.push("حالة الحساب");

  if(missing.length){
    /* لا نكتفي برسالة — ننقله إلى أول قسم ناقص ونسمّي ما ينقص فيه */
    const secs = S.secs || [];
    let target = 0;
    for(let i = 0; i < secs.length; i++){ if(sectionMissing(secs[i])){ target = i; break; } }
    goTab(target);
    $("#editMsg").innerHTML = `<div class="miss-note"><em>⚠️</em><span>
      أكمل هذه الحقول قبل الحفظ: <b>${esc(missing.join("، "))}</b></span></div>`;
    paintTabs();
    window.scrollTo({top:0, behavior:"smooth"});
    return;
  }
  $("#editMsg").innerHTML = "";

  const dup = S.partners.find(x => x.phone && String(x.phone).slice(-9) === String(p.phone).slice(-9)
                                && String(x.id) !== String(p.id));
  if(dup && !confirm(`الرقم مسجّل أيضاً لـ «${dup.name}». متابعة الحفظ؟`)) return;

  const b = $("#btnSave");
  b.innerHTML = '<span class="sp"></span>'; b.disabled = true;
  try{
    const r = await api("opSavePartner", {partner:p});
    if(!r || !r.success) throw new Error((r && r.msg) || "لم ينجح الحفظ");
    const isNew = !S.cur.id;
    p.id = r.id;
    S.cur = p;
    S.dirty = false;
    markUnsaved();
    toast(isNew ? "أُضيف الشريك — أضف الآن " + SK(p.sector).itemMany : "حُفظت التعديلات", false, "ok");
    await load();
    renderEdit(false);
    if(isNew) openItems();
  }catch(e){ toast(e.message, true); }
  finally{ b.textContent = "حفظ"; b.disabled = false; }
};

async function delPartner(){
  if(!confirm("سيُحذف الشريك وكل عناصره نهائياً. متأكد؟")) return;
  if(prompt('اكتب كلمة "حذف" للتأكيد') !== "حذف") return;
  try{
    const r = await api("opDelete", {kind:"partner", id:S.cur.id});
    if(r && r.success){ toast("حُذف الشريك", false, "ok"); S.dirty = false; await load(); go("vList"); }
    else toast((r && r.msg) || "لم ينجح", true);
  }catch(e){}
}

function openItems(){

    box.innerHTML = S.curItems.map((it, i) => {

      const on = it.status === "available";
      return `<button class="item" onclick="openItem(${i})">
        ${cov ? `<img src="${esc(cov)}" alt="" loading="lazy">` : `<div class="nop">${sk.itemIcon}</div>`}

    }).join("");

  $("#hSub").textContent = sk.itemMany;
}

function openItem(idx){
  const sk = SK(S.cur.sector).item;
  const it = idx >= 0
    ? JSON.parse(JSON.stringify(S.curItems[idx]))
    : {id:"", partner_id:S.cur.id, sector:S.cur.sector, status:"available",
       features:[], specs:{}, media:[]};
  it._idx = idx;
  S.curItem = it;
  S.itemMedia = Array.isArray(it.media) ? it.media.slice() : [];
  S.dirty = false;

  const base = ITEM_BASE.map(f => f.k === "type" ? Object.assign({}, f, {opts:sk.types}) : f);

  $("#itemMsg").innerHTML = "";
  $("#itemForm").innerHTML =
    group("ib", "الأساسيات", `<div class="fg">${base.map(f => fieldHTML(f, it[f.k], "i_")).join("")}</div>`, true) +
    group("ifeat", "المميزات",
      `<div class="pills" id="i_features">${sk.features.map(o =>
        `<button type="button" class="pill ${(it.features||[]).includes(o)?"on":""}" data-o="${esc(o)}"
          onclick="this.classList.toggle('on');scoreNow()">${esc(o)}</button>`).join("")}</div>`, true) +
    `<div class="pane on" data-a="violet">${
      groupFields(sk.specs, ITEM_GROUPS[S.cur.sector]).map(function(g){
        return `<div class="sub"><div class="sub-h"><span class="sub-i">${g.i}</span><b>${esc(g.t)}</b></div>
          <div class="sub-b"><div class="fg">${g.fs.map(function(f){
            return fieldHTML(f, (it.specs||{})[f.k], "is_"); }).join("")}</div></div></div>`;
      }).join("")}</div>` +
    group("imedia", "الصور", galleryHTML("im"), true) +
    (it.id ? `<div class="acts" style="margin:16px 0 24px">
      <button type="button" class="btn btn-x" onclick="delItem()">حذف نهائياً</button></div>` : "");

  $$("#itemForm input, #itemForm select, #itemForm textarea").forEach(el =>
    el.addEventListener("input", () => { S.dirty = true; scoreNow(); }));

  const nx = $("#btnSaveNext");
  if(nx) nx.classList.toggle("hidden", idx >= 0);
  go("vItem");
  paintGallery("im");
  markUnsaved();
  $("#hTitle").textContent = idx >= 0 ? it.name : "عنصر جديد";
  $("#hSub").textContent = S.cur.name || "";
  scoreNow();
}

async function saveItem(again){
  if(S.uploading > 0) return toast("انتظر انتهاء رفع الصور", true);
  const sk = SK(S.cur.sector).item;
  const base = ITEM_BASE.map(f => f.k === "type" ? Object.assign({}, f, {opts:sk.types}) : f);

  const it = Object.assign({}, S.curItem);
  base.forEach(f => it[f.k] = readField(f, "i_"));
  const fe = $("#i_features");
  it.features = fe ? [...fe.querySelectorAll(".pill.on")].map(x => x.dataset.o) : [];
  it.specs = {};
  sk.specs.forEach(f => it.specs[f.k] = readField(f, "is_"));
  it.media = S.itemMedia;
  it.partner_id = S.cur.id;
  it.sector = S.cur.sector;
  const idx = it._idx;
  delete it._idx;

  const miss = base.filter(f => f.req).filter(f => {
    const v = it[f.k]; return !v || (Array.isArray(v) && !v.length);
  }).map(f => f.l).concat(
    sk.specs.filter(f => f.req).filter(f => {
      const v = it.specs[f.k]; return !v || (Array.isArray(v) && !v.length);
    }).map(f => f.l));

  if(miss.length){
    $("#itemMsg").innerHTML = `<div class="msg no">أكمل أولاً: ${esc(miss.join("، "))}</div>`;
    window.scrollTo({top:0, behavior:"smooth"});
    return;
  }
  $("#itemMsg").innerHTML = "";

  const b = again ? $("#btnSaveNext") : $("#btnSaveItem");
  const label = b.textContent;
  b.innerHTML = '<span class="sp"></span>'; b.disabled = true;
  try{
    const r = await api("opSaveOffering", {offering:it});
    if(!r || !r.success) throw new Error((r && r.msg) || "لم ينجح الحفظ");
    it.id = r.id;
    if(idx >= 0) S.curItems[idx] = it; else S.curItems.push(it);
    S.curItem = it;
    S.dirty = false;
    markUnsaved();
    load();
    if(again){
      toast("حُفظ — أضف التالي", false, "ok");
      openItem(-1);
    }else{
      toast("حُفظ", false, "ok");
      openItems();
    }
  }catch(e){ toast(e.message, true); }
  finally{ b.textContent = label; b.disabled = false; }
}

$("#btnSaveItem").onclick = () => saveItem(false);
$("#btnSaveNext").onclick = () => saveItem(true);

async function delItem(){
  if(!confirm("حذف هذا العنصر نهائياً؟")) return;
  try{
    const r = await api("opDelete", {kind:"offering", id:S.curItem.id});
    if(r && r.success){
      S.curItems = S.curItems.filter(x => String(x.id) !== String(S.curItem.id));
      S.dirty = false;
      toast("حُذف", false, "ok");
      openItems(); load();
    } else toast((r && r.msg) || "لم ينجح", true);
  }catch(e){}
}

/* ═══════════════════════════════════════════════════════════════════════
   التنقّل
═══════════════════════════════════════════════════════════════════════ */
const BACKMAP = {vEdit:"vList", vItems:"vEdit", vItem:"vItems"};

$$(".nav button[data-v]").forEach(b => b.onclick = () => {
  if(!guardLeave()) return;
  go(b.dataset.v);
});

$("#btnBack").onclick = () => {
  const t = BACKMAP[S.view] || "vList";
  if(S.view === "vItem"){ if(!guardLeave()) return; return openItems(); }
  if(S.view === "vItems"){ renderEdit(!S.cur.id); return go("vEdit"); }
  if(!guardLeave()) return;
  go(t);
};

function unsavedPhotos(){
  if(S.view === "vEdit"){
    const saved = (S.cur && Array.isArray(S.cur.media)) ? S.cur.media.length : 0;
    return Math.max(0, S.media.length - saved);
  }
  if(S.view === "vItem"){
    const saved = (S.curItem && Array.isArray(S.curItem.media)) ? S.curItem.media.length : 0;
    return Math.max(0, S.itemMedia.length - saved);
  }
  return 0;
}

function guardLeave(){
  const ph = unsavedPhotos();
  if(!S.dirty && !ph) return true;
  /* الصورة المرفوعة وغير المحفوظة أثمن من حقل نصّي — نسمّيها صراحةً */
  const msg = ph
    ? "لديك " + ph + (ph === 1 ? " صورة مرفوعة" : " صور مرفوعة") +
      " لم تُحفظ بعد.\nالخروج الآن يفقدها ويجب رفعها من جديد.\n\nالخروج بدون حفظ؟"
    : "لديك تغييرات لم تُحفظ. الخروج بدون حفظ؟";
  if(confirm(msg)){ S.dirty = false; return true; }
  return false;
}

function go(view){
  S.view = view;
  ["vList","vEdit","vItems","vItem","vSys"].forEach(v => $("#" + v).classList.toggle("hidden", v !== view));
  $$(".nav button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  $("#btnBack").classList.toggle("hidden", !BACKMAP[view]);
  if(view === "vList"){
    $("#hTitle").textContent = "الشركاء";
    $("#mark").textContent = "🐋";
    $("#hSub").innerHTML = `<i class="dot" id="live"></i><span id="liveTxt">متصل</span>`;
  }
  if(view === "vEdit") updateHeader();
  if(view === "vSys"){ $("#hTitle").textContent = "الحساب"; $("#hSub").textContent = ""; renderSys(); }
  window.scrollTo({top:0});
}

function renderSys(){
  const total = S.partners.length;
  const by = k => S.partners.filter(p => p.status === k).length;
  const weak = S.partners.filter(p => Number(p.completeness||0) < 70).length;
  const noItems = S.partners.filter(p => !Number(p.items||0)).length;
  $("#sysStats").innerHTML = [
    ["إجمالي الشركاء", total],
    ["مفعّل", by("active")],
    ["قيد المراجعة", by("pending")],
    ["موقوف", by("blocked")],
    ["ملفات ناقصة (أقل من ٧٠٪)", weak],
    ["بلا عناصر", noItems]
  ].map(([l,v]) => `<div class="row" style="cursor:default">
      <div class="row-mid"><b>${l}</b></div>
      <div class="row-end"><b class="num" style="font-size:20px">${v}</b></div></div>`).join("");
}

/* ═══════════════════════════════════════════════════════════════════════
   أدوات
═══════════════════════════════════════════════════════════════════════ */
let toastT = null;
function toast(text, bad, kind){
  $("#toastHost").innerHTML = `<div class="toast ${bad ? "no" : (kind||"")}" role="status">${esc(text)}</div>`;
  clearTimeout(toastT);
  toastT = setTimeout(() => $("#toastHost").innerHTML = "", 2600);
}

window.addEventListener("beforeunload", e => {
  if(S.dirty || unsavedPhotos()){ e.preventDefault(); e.returnValue = ""; }
});
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSheet(); });
</script>
</body>
</html>
