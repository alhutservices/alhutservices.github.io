<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#F2F5F7">
<title>مركز الاتصال — منصة الحوت</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════════════
   مركز الاتصال — أداة مكتبية كثيفة، عكس لوحة الشريك:
   ورق فاتح، تباين عالٍ، صفوف مضغوطة، لوحة مفاتيح أولاً.
   اللون يقول حالة توفّر فقط: أخضر متاح، رمادي مشغول.
═══════════════════════════════════════════════════════════ */
:root{
  --paper:#F2F5F7; --card:#FFFFFF; --line:#DCE4E8; --line-2:#EDF1F3;
  --ink:#16232B; --ink-2:#4A616C; --ink-3:#8398A3;
  --free:#0E9F6E; --busy:#94A6AE; --wait:#C77700; --stop:#D6453C;
  --r:10px;
  --sans:"IBM Plex Sans Arabic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.55}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hidden{display:none!important}

.top{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:12px 16px}
.top-row{display:flex;align-items:center;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.logo{font-weight:700;font-size:15px;white-space:nowrap;display:flex;align-items:center;gap:7px}
.logo em{font-style:normal;font-size:18px}
.logo small{color:var(--ink-3);font-weight:500;font-size:12px}
.spacer{flex:1}
.who{font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.fresh{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-3)}
.dot.on{background:var(--free)}
.dot.off{background:var(--stop)}
.ghost{padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px;white-space:nowrap}
.ghost:hover{border-color:var(--ink-3)}

.searchbar{position:relative}
.searchbar input{width:100%;padding:15px 46px 15px 16px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--card);font-size:16px;font-weight:500}
.searchbar input:focus{border-color:var(--ink);outline:none}
.searchbar .mag{position:absolute;inset-inline-start:16px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:17px;pointer-events:none}
.searchbar .kbd{position:absolute;inset-inline-end:14px;top:50%;transform:translateY(-50%);
  font-family:var(--mono);font-size:11px;color:var(--ink-3);border:1px solid var(--line);
  border-radius:5px;padding:2px 6px;background:var(--paper)}
.searchbar input:focus ~ .kbd{display:none}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.filters select{padding:7px 11px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:13px}
.pill{padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;color:var(--ink-2);white-space:nowrap}
.pill.on{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:600}
.count{font-size:12.5px;color:var(--ink-3);margin-inline-start:auto;white-space:nowrap}
.tabs{display:flex;gap:2px;background:var(--line-2);padding:3px;border-radius:10px;width:max-content}
.tabs button{padding:8px 18px;border-radius:8px;font-size:13.5px;color:var(--ink-2);font-weight:500}
.tabs button.on{background:var(--card);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

main{max-width:1180px;margin:0 auto;padding:16px}

/* ── العنصر المميّز: شريط التوفّر ── */
.avail{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:18px;overflow:hidden}
.avail-hd{padding:13px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.avail-hd b{font-size:15px}
.avail-hd span{font-size:12.5px;color:var(--ink-3)}
.offices{display:flex;gap:10px;overflow-x:auto;padding:14px 16px;scrollbar-width:thin}
.office{flex:none;min-width:212px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--paper)}
.office.has{border-color:rgba(14,159,110,.45);background:#F1FAF6}
.office-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:3px}
.office-hd b{font-size:14px;line-height:1.35}
.stock{font-family:var(--mono);font-size:19px;font-weight:600;line-height:1;color:var(--busy)}
.office.has .stock{color:var(--free)}
.stock small{font-size:11px;font-weight:500;color:var(--ink-3)}
.office-meta{font-size:12px;color:var(--ink-2);margin-bottom:10px}
.call{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;padding:8px;
  border-radius:8px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;text-decoration:none}
.call.off{background:var(--line);color:var(--ink-3);pointer-events:none}

.row-car{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;margin-bottom:8px}
.row-car.busy{opacity:.62}
.thumb{width:56px;height:44px;border-radius:7px;object-fit:cover;background:var(--line-2);display:block}
.thumb-ph{width:56px;height:44px;border-radius:7px;background:var(--line-2);display:grid;place-items:center;font-size:17px;opacity:.5}
.car-main{min-width:0}
.car-main b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.car-sub{font-size:12.5px;color:var(--ink-2);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:2px}
.plate{font-family:var(--mono);font-size:11.5px;background:var(--line-2);padding:1px 6px;border-radius:4px;color:var(--ink-2)}
.car-end{text-align:end;white-space:nowrap}
.price{font-family:var(--mono);font-weight:600;font-size:14px}
.state{font-size:11.5px;font-weight:600;margin-top:2px}
.state.free{color:var(--free)}
.state.busy{color:var(--busy)}

.row-ord{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:11px 13px;margin-bottom:8px;border-inline-start:3px solid var(--edge,var(--line))}
.row-ord.st-pending{--edge:var(--wait)}
.row-ord.st-active,.row-ord.st-confirmed{--edge:var(--free)}
.row-ord.st-completed{--edge:var(--busy)}
.row-ord.st-cancelled,.row-ord.st-rejected{--edge:var(--stop)}
.ord-hd{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:6px}
.ord-hd b{font-size:14.5px}
.tag{font-size:11px;padding:2.5px 8px;border-radius:999px;background:var(--line-2);color:var(--ink-2);font-weight:500}
.tag.wait{background:#FDF3E0;color:var(--wait)}
.tag.free{background:#E9F7F1;color:var(--free)}
.tag.stop{background:#FBEAE9;color:var(--stop)}
.oid{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);margin-inline-start:auto}
.ord-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:5px 16px}
.f{display:flex;gap:7px;font-size:13px;min-width:0}
.f span{color:var(--ink-3);flex:none}
.f b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tel{color:var(--ink);font-family:var(--mono);text-decoration:none;border-bottom:1px solid var(--line)}
.tel:hover{border-color:var(--ink)}

.empty{text-align:center;padding:64px 20px;color:var(--ink-3)}
.empty .ico{font-size:34px;display:block;margin-bottom:12px;opacity:.4}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:5px}
.empty p{margin:0;font-size:13px;max-width:300px;margin-inline:auto}
.note{background:#FDF3E0;border:1px solid #F2D9A8;color:#7A4C00;padding:11px 14px;border-radius:var(--r);font-size:13px;margin-bottom:14px}

/* ── الدخول ── */
.gate{min-height:100dvh;display:grid;place-items:center;padding:24px}
.gate-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px;width:100%;max-width:370px}
.gate-card .em{font-size:30px;display:block;text-align:center;margin-bottom:10px}
.gate-card h1{font-size:19px;margin:0 0 5px;text-align:center}
.gate-card p{color:var(--ink-3);font-size:13px;margin:0 0 20px;text-align:center}
.gate-card label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px;font-weight:500}
.gate-card input{width:100%;padding:12px;border-radius:9px;border:1.5px solid var(--line);margin-bottom:12px}
.gate-card input:focus{border-color:var(--ink);outline:none}
.gate-card input.code{text-align:center;font-family:var(--mono);font-size:17px;letter-spacing:.15em}
.gate-card button{width:100%;padding:13px;border-radius:9px;background:var(--ink);color:#fff;font-weight:600}
.gate-err{background:#FBEAE9;border:1px solid #F2C4C0;color:var(--stop);padding:10px 12px;border-radius:8px;font-size:13px;margin-bottom:13px}
.gate-hint{font-size:12px;color:var(--ink-3);text-align:center;margin-top:14px;line-height:1.7}

.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(50%);z-index:90;
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:9px;font-size:13.5px;font-weight:500;
  box-shadow:0 6px 24px rgba(0,0,0,.2)}
.spin{width:15px;height:15px;border:2px solid var(--line);border-top-color:var(--ink);
  border-radius:50%;animation:sp .7s linear infinite;display:inline-block;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

@media(max-width:640px){
  .top-in{padding:10px 12px}
  main{padding:12px}
  .searchbar .kbd{display:none}
  .row-car{grid-template-columns:44px 1fr auto}
  .thumb,.thumb-ph{width:44px;height:36px}
}
</style>
</head>
<body>

<!-- ══════════ الدخول ══════════ -->
<div id="gate" class="gate">
  <div class="gate-card">
    <span class="em">🐋</span>
    <h1>مركز الاتصال</h1>
    <p>سجّل الدخول باسمك ورمزك</p>
    <div id="gateErr" class="gate-err hidden"></div>
    <label>اسم الموظف</label>
    <input id="gName" autocomplete="username" placeholder="كما هو مسجّل في شيت الموظفين">
    <label>رمز الدخول</label>
    <input id="gCode" class="code" type="password" inputmode="numeric" autocomplete="current-password" placeholder="••••">
    <button id="gGo">دخول</button>
    <p class="gate-hint">نسيت رمزك؟ الإدارة تجده في شيت الموظفين.<br>تنتهي الجلسة تلقائياً بعد ٦ ساعات.</p>
  </div>
</div>

<!-- ══════════ التطبيق ══════════ -->
<div id="app" class="hidden">

<header class="top">
  <div class="top-in">
    <div class="top-row">
      <div class="logo"><em>🐋</em>مركز الاتصال <small>عرض فقط</small></div>
      <div class="tabs">
        <button class="on" data-tab="fleet">الأسطول</button>
        <button data-tab="orders">الطلبات</button>
      </div>
      <div class="spacer"></div>
      <span class="who" id="who"></span>
      <div class="fresh"><i class="dot" id="dot"></i><span id="freshTxt">يُحمّل…</span></div>
      <button class="ghost" id="btnSync">تحديث</button>
      <button class="ghost" id="btnOut">خروج</button>
    </div>

    <div class="searchbar">
      <span class="mag">🔍</span>
      <input id="q" autocomplete="off" placeholder="ابحث باسم السيارة أو اللوحة أو المكتب…">
      <span class="kbd">/</span>
    </div>

    <div class="filters" id="fleetFilters">
      <select id="fCity"><option value="">كل المدن</option></select>
      <select id="fCat">
        <option value="">كل الفئات</option>
        <option value="economy">اقتصادية</option>
        <option value="family">عائلية</option>
        <option value="luxury">فاخرة</option>
        <option value="wedding">زفاف</option>
      </select>
      <button class="pill on" id="fFree">المتاحة فقط</button>
      <span class="count" id="fleetCount"></span>
    </div>

    <div class="filters hidden" id="orderFilters">
      <select id="oSector">
        <option value="">كل القطاعات</option>
        <option value="car">سيارات</option>
        <option value="hotel">فنادق</option>
        <option value="hall">قاعات</option>
        <option value="school">مدارس سياقة</option>
      </select>
      <select id="oStatus">
        <option value="">كل الحالات</option>
        <option value="pending">بانتظار الرد</option>
        <option value="active">قيد التنفيذ</option>
        <option value="confirmed">مؤكَّد</option>
        <option value="completed">منجز</option>
        <option value="cancelled">ملغى</option>
        <option value="rejected">مرفوض</option>
      </select>
      <select id="oCity"><option value="">كل المدن</option></select>
      <span class="count" id="orderCount"></span>
    </div>
  </div>
</header>

<main>
  <div id="viewFleet">
    <div id="availStrip"></div>
    <div id="fleetList"></div>
  </div>
  <div id="viewOrders" class="hidden">
    <div id="orderList"></div>
  </div>
</main>
</div>

<div id="toastHost"></div>

<script>
/* ═══════════════════════════════════════════════════════════════
   ① الإعداد — قيمة واحدة فقط
   لا توكن ولا رمز داخل هذه الصفحة: الدخول يتحقّق منه السيرفر
   مقابل شيت Staff، ويعطي جلسة مؤقتة تنتهي بعد ٦ ساعات.
   ═══════════════════════════════════════════════════════════════ */
const API = "https://script.google.com/macros/s/AKfycbwOZXSohTDG9nayqJ3caUqI6q50rGXaKiAYbBr-W6Xksq8qSQH_mxVU_o-7CJQrpUWa9A/exec";

const REFRESH_MS = 45000;   // تحديث دوري خفيف؛ يتوقّف تلقائياً حين تُخفى الصفحة

const SECTORS = {
  car   : {label:"سيارات",      icon:"🚗"},
  hotel : {label:"فنادق",       icon:"🏨"},
  hall  : {label:"قاعات",       icon:"🥂"},
  school: {label:"مدارس سياقة", icon:"🎓"}
};
const STATUS = {
  pending  :{t:"بانتظار الرد", c:"wait"},
  active   :{t:"قيد التنفيذ",  c:"free"},
  confirmed:{t:"مؤكَّد",        c:"free"},
  completed:{t:"منجز",         c:""},
  cancelled:{t:"ملغى",         c:"stop"},
  rejected :{t:"مرفوض",        c:"stop"}
};
const CATS = {economy:"اقتصادية", family:"عائلية", luxury:"فاخرة", wedding:"زفاف"};

/* ═══════════════════════════════════════════════════════════════
   ② الحالة
   ═══════════════════════════════════════════════════════════════ */
let S = {
  session:"", staff:"",
  tab:"fleet", q:"", freeOnly:true,
  cars:[], orders:[], offices:{}, cities:new Set(),
  lastSync:0, timer:null
};

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => (Number(n)||0).toLocaleString("en-US");
const norm = s => String(s??"").toLowerCase()
  .replace(/[\u064B-\u0652]/g,"").replace(/[أإآ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").trim();

/* ═══════════════════════════════════════════════════════════════
   ③ الاتصال — JSONP يتجاوز قيود CORS في تحويلات Apps Script
   ═══════════════════════════════════════════════════════════════ */
function call(params){
  return new Promise((resolve, reject) => {
    const cb = "cc_" + Date.now() + Math.floor(Math.random()*1000);
    const q  = new URLSearchParams(Object.assign({callback:cb}, params));
    const sc = document.createElement("script");
    const t  = setTimeout(() => { done(); reject(new Error("انتهت مهلة الاتصال")); }, 30000);
    function done(){ clearTimeout(t); delete window[cb]; sc.remove(); }
    window[cb] = d => { done(); resolve(d); };
    sc.onerror = () => { done(); reject(new Error("تعذّر الوصول للخادم")); };
    sc.src = API + "?" + q.toString();
    document.body.appendChild(sc);
  });
}

/* ═══════════════════════════════════════════════════════════════
   ④ الدخول
   ═══════════════════════════════════════════════════════════════ */
$("#gGo").onclick = doLogin;
$("#gCode").addEventListener("keydown", e => { if(e.key === "Enter") doLogin(); });
$("#gName").addEventListener("keydown", e => { if(e.key === "Enter") $("#gCode").focus(); });

(function resume(){
  const s = sessionStorage.getItem("hut_cc_session");
  const n = sessionStorage.getItem("hut_cc_name");
  if(s){ S.session = s; S.staff = n || ""; openApp(); }
})();

async function doLogin(){
  const name = $("#gName").value.trim();
  const code = $("#gCode").value.trim();
  $("#gateErr").classList.add("hidden");
  if(!name || !code) return gateErr("اكتب اسمك ورمزك.");
  if(API.indexOf("PUT_YOUR") !== -1) return gateErr("ضع رابط النشر في المتغيّر API أعلى الملف.");

  const btn = $("#gGo");
  btn.innerHTML = '<span class="spin"></span>'; btn.disabled = true;
  try{
    const r = await call({action:"staffLogin", name, code});
    if(!r || !r.success) return gateErr((r && r.msg) || "تعذّر الدخول.");
    S.session = r.session; S.staff = r.name;
    sessionStorage.setItem("hut_cc_session", r.session);
    sessionStorage.setItem("hut_cc_name", r.name);
    openApp();
  }catch(e){ gateErr(e.message); }
  finally{ btn.textContent = "دخول"; btn.disabled = false; }
}
function gateErr(m){ const e = $("#gateErr"); e.textContent = m; e.classList.remove("hidden"); }

function openApp(){
  $("#gate").classList.add("hidden");
  $("#app").classList.remove("hidden");
  $("#who").textContent = S.staff ? "أهلاً " + S.staff : "";
  sync(true);
  schedule();
}

function logout(){
  clearInterval(S.timer);
  sessionStorage.removeItem("hut_cc_session");
  sessionStorage.removeItem("hut_cc_name");
  location.reload();
}
$("#btnOut").onclick = () => { if(confirm("تسجيل الخروج؟")) logout(); };

/* ═══════════════════════════════════════════════════════════════
   ⑤ اللقطة الدورية
   ═══════════════════════════════════════════════════════════════ */
function schedule(){
  clearInterval(S.timer);
  S.timer = setInterval(() => { if(!document.hidden) sync(); }, REFRESH_MS);
}
document.addEventListener("visibilitychange", () => {
  if(!document.hidden && Date.now() - S.lastSync > 15000) sync();
});

async function sync(first){
  if(first) $("#fleetList").innerHTML = `<div class="empty"><span class="spin"></span><p style="margin-top:12px">يُحمّل…</p></div>`;
  setFresh(null, "يحدّث…");
  try{
    const d = await call({action:"ccSnapshot", session:S.session});
    if(!d || !d.success){
      if(d && d.reason === "session"){ toast("انتهت الجلسة"); return logout(); }
      throw new Error((d && d.msg) || "رد غير متوقع");
    }
    S.cars    = d.cars   || [];
    S.orders  = d.orders || [];
    S.offices = {};
    (d.offices || []).forEach(o => {
      S.offices[String(o.id)] = o;
      if(o.city) S.cities.add(o.city);
    });
    S.cars.forEach(c => { if(c.city) S.cities.add(c.city); });
    S.orders.forEach(o => { if(o.city) S.cities.add(o.city); });
    fillCities();
    S.lastSync = Date.now();
    setFresh(true);
    paint();
  }catch(e){
    setFresh(false, "تعذّر التحديث");
    if(first) $("#fleetList").innerHTML = `<div class="note">${esc(e.message)}</div>`;
  }
}

$("#btnSync").onclick = async () => {
  $("#btnSync").innerHTML = '<span class="spin"></span>';
  await sync();
  $("#btnSync").textContent = "تحديث";
};

function setFresh(ok, label){
  $("#dot").className = "dot " + (ok === null ? "" : ok ? "on" : "off");
  if(label){ $("#freshTxt").textContent = label; return; }
  tickFresh();
}
function tickFresh(){
  if(!S.lastSync) return;
  const s = Math.floor((Date.now() - S.lastSync) / 1000);
  $("#freshTxt").textContent = s < 60 ? `محدّث قبل ${s} ثانية` : `محدّث قبل ${Math.floor(s/60)} دقيقة`;
}
setInterval(tickFresh, 10000);

function fillCities(){
  const list = [...S.cities].filter(Boolean).sort();
  ["#fCity","#oCity"].forEach(sel => {
    const el = $(sel), cur = el.value;
    el.innerHTML = `<option value="">كل المدن</option>` +
      list.map(c => `<option${c === cur ? " selected" : ""}>${esc(c)}</option>`).join("");
  });
}

/* ═══════════════════════════════════════════════════════════════
   ⑥ الأسطول — البحث وشريط التوفّر
   ═══════════════════════════════════════════════════════════════ */
function fleetMatches(){
  const q = norm(S.q);
  const city = $("#fCity").value, cat = $("#fCat").value;
  return S.cars.filter(c => {
    if(city && c.city !== city) return false;
    if(cat && c.cat !== cat) return false;
    if(S.freeOnly && c.status !== "available") return false;
    if(!q) return true;
    return [c.name, c.plate, c.color, CATS[c.cat] || c.cat, c.office_name, c.city]
      .some(v => norm(v).includes(q));
  });
}

function renderFleet(){
  const list = fleetMatches();
  $("#fleetCount").textContent = list.length ? `${list.length} سيارة` : "";
  renderAvail(list);

  const box = $("#fleetList");
  if(!list.length){
    box.innerHTML = S.q
      ? `<div class="empty"><span class="ico">🔍</span><b>لا نتيجة لـ «${esc(S.q)}»</b>
         <p>جرّب اسماً أقصر، أو ألغِ «المتاحة فقط» لترى السيارات المشغولة أيضاً.</p></div>`
      : `<div class="empty"><span class="ico">🚗</span><b>لا سيارات مطابقة</b>
         <p>عدّل الفلاتر أو اضغط تحديث.</p></div>`;
    return;
  }
  list.sort((a,b) =>
    (a.status === "available" ? 0 : 1) - (b.status === "available" ? 0 : 1) ||
    String(a.name).localeCompare(String(b.name), "ar"));

  box.innerHTML = list.map(c => {
    const free = c.status === "available";
    return `<div class="row-car ${free?"":"busy"}">
      ${c.photo_url ? `<img class="thumb" src="${esc(c.photo_url)}" alt="" loading="lazy">`
                    : `<div class="thumb-ph">🚗</div>`}
      <div class="car-main">
        <b>${esc(c.name)}</b>
        <div class="car-sub">
          <span>${esc(c.office_name)}</span>
          ${c.city ? `<span>· ${esc(c.city)}</span>` : ""}
          ${c.plate ? `<span class="plate">${esc(c.plate)}</span>` : ""}
          ${c.color ? `<span>· ${esc(c.color)}</span>` : ""}
          ${c.cat ? `<span>· ${esc(CATS[c.cat] || c.cat)}</span>` : ""}
        </div>
      </div>
      <div class="car-end">
        <div class="price">${money(c.price)}</div>
        <div class="state ${free?"free":"busy"}">${free ? "متاحة" : "مشغولة"}</div>
      </div>
    </div>`;
  }).join("");
}

/* جواب المكالمة في نظرة واحدة: أي مكتب فيه هذه السيارة الآن */
function renderAvail(list){
  const box = $("#availStrip");
  if(!S.q.trim() || !list.length){ box.innerHTML = ""; return; }

  const by = {};
  list.forEach(c => {
    const k = c.office_id || "SHARED";
    if(!by[k]) by[k] = {name:c.office_name, city:c.city, phone:c.office_phone, free:0, total:0, min:Infinity};
    by[k].total++;
    if(c.status === "available"){
      by[k].free++;
      by[k].min = Math.min(by[k].min, Number(c.price) || Infinity);
    }
  });
  const groups = Object.values(by).sort((a,b) => b.free - a.free);
  const totalFree = groups.reduce((s,g) => s + g.free, 0);

  box.innerHTML = `<div class="avail">
    <div class="avail-hd">
      <b>«${esc(S.q)}»</b>
      <span>${totalFree} متاحة الآن في ${groups.filter(g=>g.free).length} مكتب من أصل ${groups.length}</span>
    </div>
    <div class="offices">${groups.map(g => `
      <div class="office ${g.free?"has":""}">
        <div class="office-hd">
          <b>${esc(g.name)}</b>
          <div class="stock">${g.free}<small>/${g.total}</small></div>
        </div>
        <div class="office-meta">${esc(g.city||"—")}${g.min!==Infinity ? " · من " + money(g.min) + " د.ع" : ""}</div>
        ${g.phone ? `<a class="call" href="tel:${esc(g.phone)}">📞 ${esc(g.phone)}</a>`
                  : `<span class="call off">لا رقم مسجّل</span>`}
      </div>`).join("")}</div>
  </div>`;
}

/* ═══════════════════════════════════════════════════════════════
   ⑦ الطلبات — عرض فقط
   ═══════════════════════════════════════════════════════════════ */
function renderOrders(){
  const q = norm(S.q);
  const sec = $("#oSector").value, st = $("#oStatus").value, city = $("#oCity").value;
  const list = S.orders.filter(o => {
    if(sec && o.sector !== sec) return false;
    if(st && o.status !== st) return false;
    if(city && o.city !== city) return false;
    if(!q) return true;
    return [o.id, o.customer, o.phone, o.title, o.partner].some(v => norm(v).includes(q));
  });
  $("#orderCount").textContent = list.length ? `${list.length} طلب` : "";

  const box = $("#orderList");
  if(!list.length){
    box.innerHTML = `<div class="empty"><span class="ico">📋</span><b>لا طلبات مطابقة</b>
      <p>ابحث برقم هاتف الزبون أو رقم الطلب للوصول إليه مباشرة.</p></div>`;
    return;
  }
  box.innerHTML = list.map(o => {
    const s = STATUS[o.status] || {t:o.status, c:""};
    const sec2 = SECTORS[o.sector] || {icon:"•"};
    return `<div class="row-ord st-${esc(o.status)}">
      <div class="ord-hd">
        <span>${sec2.icon}</span>
        <b>${esc(o.title)}</b>
        <span class="tag ${s.c}">${s.t}</span>
        <span class="oid">#${esc(o.id)}</span>
      </div>
      <div class="ord-grid">
        <div class="f"><span>الزبون</span><b>${esc(o.customer||"—")}</b></div>
        <div class="f"><span>الهاتف</span><b>${o.phone ? `<a class="tel" href="tel:${esc(o.phone)}">${esc(o.phone)}</a>` : "—"}</b></div>
        <div class="f"><span>المدينة</span><b>${esc(o.city||"—")}</b></div>
        <div class="f"><span>التاريخ</span><b>${esc(o.date||"—")}</b></div>
        <div class="f"><span>المدة</span><b>${esc(o.qty||"—")}</b></div>
        <div class="f"><span>المبلغ</span><b class="mono">${money(o.total)}</b></div>
        <div class="f"><span>الشريك</span><b>${esc(o.partner || "لم يُسنَد بعد")}</b></div>
      </div>
    </div>`;
  }).join("");
}

/* ═══════════════════════════════════════════════════════════════
   ⑧ التفاعل
   ═══════════════════════════════════════════════════════════════ */
let qT;
$("#q").addEventListener("input", e => {
  clearTimeout(qT);
  qT = setTimeout(() => { S.q = e.target.value; paint(); }, 160);
});

$$(".tabs button").forEach(b => b.onclick = () => {
  $$(".tabs button").forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  S.tab = b.dataset.tab;
  $("#viewFleet").classList.toggle("hidden", S.tab !== "fleet");
  $("#viewOrders").classList.toggle("hidden", S.tab !== "orders");
  $("#fleetFilters").classList.toggle("hidden", S.tab !== "fleet");
  $("#orderFilters").classList.toggle("hidden", S.tab !== "orders");
  $("#q").placeholder = S.tab === "fleet"
    ? "ابحث باسم السيارة أو اللوحة أو المكتب…"
    : "ابحث برقم الهاتف أو اسم الزبون أو رقم الطلب…";
  paint();
});

$("#fFree").onclick = () => {
  S.freeOnly = !S.freeOnly;
  $("#fFree").classList.toggle("on", S.freeOnly);
  $("#fFree").textContent = S.freeOnly ? "المتاحة فقط" : "كل السيارات";
  renderFleet();
};

["#fCity","#fCat"].forEach(s => $(s).onchange = renderFleet);
["#oSector","#oStatus","#oCity"].forEach(s => $(s).onchange = renderOrders);

document.addEventListener("keydown", e => {
  if(e.key === "/" && document.activeElement !== $("#q")){ e.preventDefault(); $("#q").focus(); $("#q").select(); }
  if(e.key === "Escape" && document.activeElement === $("#q")){ $("#q").value = ""; S.q = ""; paint(); $("#q").blur(); }
});

function paint(){ S.tab === "fleet" ? renderFleet() : renderOrders(); }

let tT;
function toast(m){
  clearTimeout(tT);
  $("#toastHost").innerHTML = `<div class="toast">${esc(m)}</div>`;
  tT = setTimeout(() => $("#toastHost").innerHTML = "", 2600);
}
</script>
</body>
</html>
